060. Format: Lecture, class discussion, simulation/role play, and video demonstrations. Materials: Textbook and course pack."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-7820","sid":"MGMT-7820-001","cu":1,"title":"Strategic Implementation","days":"M, W","st":510,"et":599,"onList":"Yes","listCU":1,"listSec":2,"insts":[{"n":"Sharique Hasan","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT7820002","desc":"Much more is known about strategy formulation than its implementation, yet valid, sensible strategies often fail because of problems on the implementation side. This course provides you with tools to turn good strategy into successful reality. It covers the choices, structure, and conditions that enable the successful attainment of strategic objectives. Students learn from rigorous academic research on successful implementation, as well as a series of seasoned business leaders who will visit to share their own experience from the front lines.\nWharton MBA Course. Attendance at first day is mandatory. Course must be taken for a grade. MBA students must request enrollment for this class through Course Match and should not use the “Add to Cart” or “Request Permission” functions. Auditors need permission."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-7820","sid":"MGMT-7820-002","cu":1,"title":"Strategic Implementation","days":"M, W","st":930,"et":1019,"onList":"Yes","listCU":1,"listSec":2,"insts":[{"n":"Sharique Hasan","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT7820002","desc":"Much more is known about strategy formulation than its implementation, yet valid, sensible strategies often fail because of problems on the implementation side. This course provides you with tools to turn good strategy into successful reality. It covers the choices, structure, and conditions that enable the successful attainment of strategic objectives. Students learn from rigorous academic research on successful implementation, as well as a series of seasoned business leaders who will visit to share their own experience from the front lines.\nWharton MBA Course. Attendance at first day is mandatory. Course must be taken for a grade. MBA students must request enrollment for this class through Course Match and should not use the “Add to Cart” or “Request Permission” functions. Auditors need permission."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-8330","sid":"MGMT-8330-401","cu":0.5,"title":"Strat & Prac of Family","days":"M, W","st":720,"et":809,"onList":"Yes","listCU":0.5,"listSec":1,"insts":[{"n":"Petru Sandu","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT8330401","desc":"This course is designed for those persons who desire to understand the distinct strategies and practices of family-controlled companies and family wealth creation. It will focus on stakeholder decision making; financial and resource driven options for long-run competitiveness, organizational structures, management team issues; strategic planning from a resource-based perspective; transition planning for the corporate entity, family dynamics, communication issues; and leadership empowerment. The course is intended for those who plan to consult or provide professional services to family-controlled companies and for those planning a career in a family firm. The class is structured around topical lectures with frequent utilization of case studies requiring active class participation, as well as on-site and off-site project work time. Submission of several written case studies, and a term project are required. Open to Wharton MBA and Penn graduate students.\nWharton MBA Course. Course must be taken for a grade. MBA students must request enrollment for this class through Course Match and should not use the “Add to Cart” or “Request Permission” functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-8750","sid":"MGMT-8750-401","cu":1,"title":"Comparative Capitalism","days":"T, R","st":720,"et":809,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Mitchell Orenstein","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT8750401","desc":"While we often debate capitalism as a system, the nature of capitalist economies differ from country to country and rarely match up to the ideal. Why do these differences arise? Is there a pure form of capitalism? What is the nature of capitalism in advanced and emerging economies? Why are capitalist economies often embedded in other social systems? Why do some economies grow faster than others? How do international institutions and interdependencies affect national capitalist institutions? How are the strategies of multinational corporations (MNCs) influenced by their country of origin? And how is the nature of capitalism changing today? This course provides insight into these questions as it explores the nature of capitalism around the world, with specific reference to Brazil, Russia, Ukraine, China, Hungary, Nigeria, South Africa, Singapore, Israel, Argentina, and the advanced OECD countries. Students will leave this class with understanding key differences in how capitalist economies are organized and competition over the future of the world economy."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-8910","sid":"MGMT-8910-001","cu":1,"title":"Advanced Study-Smgt","onList":"No","insts":[{"n":"Aswin Mannepalli","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT8910001","desc":"This 1.0-credit experiential learning course matches small teams of MBA students with innovative technologies developed by Penn researchers. Students will engage directly with inventors to understand the science behind early-stage innovations and explore their potential for commercialization. Through a combination of instructor-led discussions on commercialization frameworks and independent team research, students will gain hands-on experience at the intersection of strategy, innovation, corporate venturing, and entrepreneurship.\nProjects for this class have been sourced from the University of Pennsylvania’s Perelman School of Medicine, School of Arts and Sciences, Center for Innovation & Precision Dentistry, and the Stuart Weitzman School of Design. In some cases, established corporations may also be involved, providing additional industry context and pathways to impact.\nStudents must apply to be considered for the course. The course is open to second-semester and second-year MBA students; Wharton Executive MBA (WEMBA) students may also be considered. Ideal candidates have experience or a strong interest in commercialization, innovation, or entrepreneurship.\nThis is an Advanced Study course for MBA and Executive MBA students. This course, however is not offered through Course Match but by application only. Here is the link to apply: https://mackinstitute.wharton.upenn.edu/students/commercialization-of-academic-science-class/"},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-9180","sid":"MGMT-9180-002","cu":0.5,"title":"Personnel Economics A","days":"T","st":930,"et":1109,"onList":"No","insts":[{"n":"John Paul. Macduffie","cq":"N/A","iq":"New","d":"N/A","w":"N/A"},{"n":"Lindsey Cameron","cq":"N/A","iq":"New","d":"N/A","w":"N/A"},{"n":"Tiantian Yang","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT9180002","desc":"This is a half-semester PhD course in the Management Department that is also open to any current PhD students at Wharton. The canonical model in economics views an agent as a fully rational, atomistic individual making optimal choices under scarcity. This approach has been very powerful theoretically and empirically to explain and to predict behavior in the workplace. This model has also been enriched to accommodate other phenomena arguably affecting behavior in the workplace like the social context (e.g. peer effects, altruism, or social comparison), non-standard time preferences, loss aversion, and cognitive costs. Incorporating these ideas into the standard model can be accomplished in various ways but the real stress test for these theories is whether they predict behavior more generally (i.e. we don't just use theory to explain one choice but choices more generally) and to generate empirical predictions that can be tested using experiments. In this mini-course we start-off with a tour de force of the fundamental principal-agent model and the various behavioral extensions. The core of the course is, however, not theoretical but a practical course on how to design field experiments to test these ideas."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-9260","sid":"MGMT-9260-001","cu":0.5,"title":"Sem Strat & Org Des","days":"M","st":825,"et":1004,"onList":"No","insts":[{"n":"Claudine D. Gartenberg","cq":"N/A","iq":"New","d":"N/A","w":"N/A"},{"n":"Saerom Lee","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT9260001","desc":"This half-semester course examines one of the foundational questions in strategy: the role of organizational structure in both supporting and shaping strategy. As Winston Churchill famously said: \"We shape our buildings, and afterwards our buildings shape us.\" This course examines this proposition from two traditions, the \"institutional economics\" and \"information processing\" schools of organizational design. We will examine foundational works from both schools, such as Coase, Williamson, Simon, March, and others, and then proceed to recent work in the area. Some of the questions that we will explore in the class are: why do firms exist? What determines their boundaries? What determines formal and informal structures within firms? How does the strategic context shape the answers to these questions? How might the nature of the firm and its boundaries relate to innovation, human capital, and knowledge creation? The aim of this class is to provide students with a grounding in the fundamental questions and contributions in this area, and to spark ideas for research in their own graduate work."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-9380","sid":"MGMT-9380-002","cu":0.5,"title":"Seminar in Social Entrep","days":"M","st":825,"et":1004,"onList":"No","insts":[{"n":"Tyler B. Wry","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT9380002","desc":"This half-semester course examines how social enterprise organizations emerge, attract resources, and affect society. The course will bridge micro and macro theoretical perspectives to provide insight into the unique challenges faced by social enterprises, while also showing how the study of such organizations can help to advance mainstream entrepreneurship research. Individual sessions will focus on defining social entrepreneurship, the tensions and tradeoffs that emerge in organizations that pursue social and financial goals, impact investing and other sources of finance, and the role of incubators/accelerators in supporting the development of these organizations. This is a seminar-based course with active discussion and analysis."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-9510","sid":"MGMT-9510-001","cu":0.5,"title":"Ob: Theories and Methods","days":"F","st":510,"et":689,"onList":"No","insts":[{"n":"Michael Parke","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT9510001","desc":"The purpose of this half-semester course is to examine and understand theory and empirical research in the field of micro-organizational behavior and to build an understanding of people's behavior in organizations. The course covers a blend of classic and contemporary literature to appreciate the prevailing theories and findings in various areas of micro-organizational behavior. We will cover topics such as identity, diversity/inclusion, work design/proactivity, extra-role behaviors, behavioral ethics/organizational justice, and an overall look at where the field of micro-organizational behavior is heading. This is a seminar-based course with active discussion and analysis."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-9550","sid":"MGMT-9550-001","cu":0.5,"title":"Foundations Mult Mgmt.","days":"R","st":540,"et":719,"onList":"No","insts":[{"n":"Witold Jerzy. Henisz","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT9550001","desc":"The goal of the course is to provide you with a foundation in some of the major research areas that underpin the study of Multinational Management. International Business (and the study of MNCs) is an interdisciplinary field. As such, our survey of the seminal articles in the field will span a number of different theoretical and empirical approaches (i.e., economic, managerial, organizational and institutional). Much of our seminar discussions will focus on identifying and developing interesting research questions raised by this interdisciplinary literature, which offers many opportunities for systematic empirical study."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-9600","sid":"MGMT-9600-002","cu":0.5,"title":"Non-Market Strategy","days":"R","st":540,"et":719,"onList":"No","insts":[{"n":"Witold Jerzy. Henisz","cq":"N/A","iq":"New","d":"N/A","w":"N/A"},{"n":"Mary Hunter. Mcdonnell","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT9600002","desc":"This course builds on the foundational material presented in MGMT 955 with a deeper focus on current research examining institutional influences on multinational management. These include regulative supports (e.g., laws, regulations, contracts and their enforcement through litigation, arbitration of incentive compatible self-regulation) but also normative (e.g., socially shared expectations of appropriate behavior, and social exchange processes) and cognitive (e.g., creating shared identity to bridge differences in values, beliefs and framing) elements of the institutional environment. We will examine not only strategic responses in the market environment but also influence strategies of multinational and domestic firms that seek to alter the institutional environment in which they operate. We will draw not only upon the international business literature but also related literatures including political economy, sociology, law, finance, communications, institutional theory, strategic corporate social responsibility, social movements, network theory and the management of extractive industries."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-9610","sid":"MGMT-9610-002","cu":0.5,"title":"Special Topics in Ob","days":"M","st":510,"et":689,"onList":"No","insts":[{"n":"Amy Wrzesniewski","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT9610002","desc":"This is a complement course to MGMT 951, and it has the same purpose to examine and understand basics in the theory and empirical research in the field of micro-organizational behavior and to increase our understanding of people's behavior in organizations. To do so, we will cover a blend of classic and contemporary literature so that we can appreciate the prevailing theories and findings in various areas of micro-organizational behavior. In addition, for each topic we will then try to go beyond the existing literature. We will work to increase our understanding by re-framing the research variables, altering the perspective, bringing in new theory, and comparing levels of analysis. The purpose of this course is not meant to be exhaustive, rather it covers approximately half of the organizational behavior literature. For a more complete understanding of the basics of organizational behavior it is mandatory for organizational behavior students to have taken MGMT 951 which covers the remaining topics in basic organizational behavior. However, it is not mandatory to have taken MGMT 951 before MGMT 961 as they cover different sets of topics."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-9701","sid":"MGMT-9701-001","cu":0.5,"title":"Quant Research Methods in MGMT","days":"F","st":720,"et":899,"onList":"No","insts":[{"n":"Iwan Barankay","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT9701001","desc":"This PhD course exposes students to a range of methodologies and techniques in applied econometrics as seen in latest research papers. The approach is to take a detailed look at 1-2 papers per week for a thorough understanding of each topic. Students are required to carefully read and prepare the readings for each week with an emphasis on “how it was done” rather than the results of the paper.\nA provisional list of topics are: Field Experiments with Firms; Replication with confidential and non-confidential data; Difference in Difference Estimation & Linear Panel Event Studies; Instrumental Variable Regressions; Synthetic Controls & Natural Experiments; Regression Discontinuity Design"},{"src":"Manual add","sem":"Manual","cid":"FNCE-7510","sid":"FNCE-7510-002","cu":0.5,"title":"The Finance of Buyouts and Acquisitions","onList":"Yes","listCU":0.5,"listSec":2,"insts":[]},{"src":"Manual add","sem":"Manual","cid":"FNCE-7510","sid":"FNCE-7510-003","cu":0.5,"title":"The Finance of Buyouts and Acquisitions","onList":"Yes","listCU":0.5,"listSec":2,"insts":[]},{"src":"Manual add","sem":"Manual","cid":"MGMT-7880","sid":"MGMT-7880-401","cu":1,"title":"Managing and Competing in China","onList":"No","insts":[]},{"src":"M /* ---------- Course Match optimizer ---------- */
function simItems(){
  const seen = {}; const out = [];
  for (const x of R ? R.rows : []) { if (!(x.u > 0) || !isNum(x.cu)) continue; if (seen[x.sid] && seen[x.sid].u >= x.u) continue;
    const it = { sid:x.sid, cid:x.p.Q || x.cid, cid2:x.cid, cu:x.cu, u:x.u, val:x.u * x.cu, days:x.days, st:x.st, et:x.et, q:x.q, p:x.p, tgt:x.tgt, title:x.title };

}
function optimize(items, priceOf, budget = S.budget, maxCU = S.maxCU){

  const it = ord.map(i => items[i]); const price = it.map(x => { const v = priceOf(x); return isNum(v) ? v : 0; });
  const lc = new Set((it.map(x => [x.cid, x.cid2])).flat());
  const conf = it.map(() => new Uint8Array(n));
  const adj = it.map(() => new Float64Array(n));
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    const a = it[i], b = it[j];
    const c = a.cid === b.cid || a.cid2 === b.cid2 || a.cid === b.cid2 || a.cid2 === b.cid || overlaps(a, b);
    if (c) conf[i][j] = conf[j][i] = 1;

}

/* ---------- utility fitting ---------- */
function fitUtilities(){
  const T = R.T.filter(x => isNum(x.cu) && x.cu > 0);
  if (!T.length) return null;
  const B = S.budget, buf = 1 + (S.buffer || 0) / 100;
  const b = T.map(x => Math.max(0, (isNum(x.bench) ? x.bench : isNum(x.p.est) ? x.p.est : 0) * buf));
  const sb = sum(b), feasible = sb <= B;
  let t;
  if (!feasible || sb === 0) t = sb ? b.map(v => v * B / sb) : T.map(() => B / T.length);
  else if (S.spread === "top") { const ti = T.reduce((bi, x, i) => (x.u || 0) > (T[bi].u || 0) ? i : bi, 0); t = b.map((v, i) => i === ti ? v + (B - sb) : v); }
  else t = b.map(v => v * B / sb);
  // search scale s = sum(u*cu) so that u_i = ceil(t_i*s/(B*cu_i)) with max u <= 100
  const cu = T.map(x => x.cu);
  let smax = Infinity; T.forEach((x, i) => { if (t[i] > 0) smax = Math.min(smax, 100 * B * cu[i] / t[i]); });
  if (!isFinite(smax)) smax = 100 * sum(cu);
  let best = null;
  for (let k = 0; k <= 3000; k++) {
    const s = smax * (0.08 + 0.92 * k / 3000);
    const u = t.map((ti, i) => Math.min(100, Math.max(1, Math.ceil(ti * s / (B * cu[i]) - 1e-9))));
    const sp = sum(u.map((ui, i) => ui * cu[i]));
    const alloc = u.map((ui, i) => ui * cu[i] / sp * B);
    const short = feasible ? sum(alloc.map((a, i) => Math.max(0, b[i] - a))) : 0;
    const err = sum(alloc.map((a, i) => Math.abs(a - t[i])));
    const key = short * 1e6 + err;
    if (!best || key < best.key - 1e-9 || (Math.abs(key - best.key) < 1e-9 && Math.max(...u) > Math.max(...best.u))) best = { key, u, alloc, short };

}

/* ---------- Monte Carlo ---------- */
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function runMC(){

  const samplers = items.map(x => { const s = x.p.sample; if (!s || !s.length) return () => isNum(x.p.est) ? x.p.est : 0;
    const tw = sum(s.map(o => o.w)); return () => { let r = rand() * tw; for (const o of s) { r -= o.w; if (r <= 0) return o.p; } return s[s.length - 1].p; }; });

  const step = () => {

      for (const s of res.pick) hits[s]++; const k = [...res.pick].sort().join(" + ") || "(nothing)"; combos[k] = (combos[k] || 0) + 1; spend += res.cost; }
    MC = { N, done, hits, combos, items, avgSpend: spend / Math.max(1, done) };

/* ---------- PCR refresh (owner, desktop app) ---------- */

      <button class="btn small" data-refresh="${esc(cid)}">Refresh this course</button><button class="btn small ghost" data-paste>Paste data instead</button></div>
      <div id="pasteBox" hidden><p class="note">Open <a href="${apiURL}" target="_blank" rel="noopener">this link</a>, select all, copy, and paste here.</p><textarea id="pasteTxt" placeholder='{"id":"${esc(cid)}", ...}'></textarea><button class="btn small" data-applypaste="${esc(cid)}">Use this data</button> <span class="note" id="pasteMsg"></span></div></div>
    <div class="sec"><div class="label">Sections</div><div style="overflow-x:auto"><table><thead><tr><th>Section</th><th>When · who</th><th class="r">Quality</th><th class="r">Est.</th><th class="r">Low–High</th><th></th></tr></thead><tbody>
      ${secRows.map(s => { const d = s.ls || s.c; const when = d && (d.days || isNum(d.st)) ? `${esc(d.days)} ${tfmt(d.st)}–${tfmt(d.et)}` : "TBA"; const who = s.ls ? s.ls.instr.join(", ") : s.c && s.c.insts[0] ? s.c.insts[0].n : "";
        return `<tr ${s.sid === hiSid ? 'style="outline:2px solid var(--navy);outline-offset:-2px"' : ""}><td class="sid">${esc(s.sid)}<div>${s.ls ? '<span class="pill info">2027A</span>' : '<span class="pill mute">2026A only</span>'}${s.ls && s.ls.cap ? ` <span class="meta">${s.ls.cap} seats</span>` : ""}</div></td><td class="meta" style="white-space:normal">${when}<br>${esc(who)}</td>
        <td class="r num">${f2(s.ls && isNum(s.ls.cq) ? s.ls.cq : s.c ? s.c.cq : null)}</td><td class="r num" title="${esc(s.p.basis)}">${fmt(s.p.est)}</td><td class="r num">${fmt(s.p.low)}–${fmt(s.p.high)}</td>
        <td>${s.inShort ? '<span class="pill ok">added</span>' : `<button class="btn small" data-addsid="${esc(s.sid)}">Add</button>`}</td></tr>`; }).join("") || `<tr><td colspan="6" class="note">No sections known.</td></tr>`}
    </tbody></table></div></div>
    <div class="sec"><div class="label">Clearing prices by round${hk !== cid ? ` (priced as ${esc(hk)})` : ""}</div>${hist.length ? chart : `<p class="note">No clearing prices on record for this course.</p>`}
      <div class="meta"><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="var(--spring)"/></svg> Spring <svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="var(--fall)"/></svg> Fall · w = weight in the estimate · 0 means seats were left over</div></div>
    ${hiSid ? `<div class="sec"><div class="label">Your price guess for ${esc(hiSid)}</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input id="guessIn" type="number" min="0" step="50" value="${S.guesses[hiSid] ?? ""}" class="uin" style="width:110px" aria-label="Price guess"><button class="btn small" data-guess="${esc(hiSid)}">Save guess</button><span class="note">Overrides the estimate everywhere and stands in for low/high when there's no history.</span></div></div>` : ""}
    ${first && first.desc ? `<div class="sec"><div class="label">Description</div><div class="desc">${esc(first.desc)}</div></div>` : ""}
  </aside>`;
  $(".drawer [data-close]").focus();
}
function closeDrawer(){ $("#drawerHost").innerHTML = ""; }

/* ---------- settings ---------- */
function renderSetup(){
  const tm = PI.tm;
  $("#v-setup").innerHTML = `<div class="cols">
   <div class="card cardpad" style="display:grid;gap:14px">
     <h2 style="font-size:22px;font-weight:800">Price estimate</h2>
     <div class="toolbar" style="margin:0">
       <label class="field"><span class="label">Target season</span><select id="sSeason"><option ${S.season === "Spring" ? "selected" : ""}>Spring</option><option ${S.season === "Fall" ? "selected" : ""}>Fall</option></select></label>
       <label class="field"><span class="label">Target year</span><input id="sYear" type="number" value="${S.year}" step="1"></label>
       <label class="field"><span class="label">Method</span><select id="sMethod">${METHODS.map(m => `<option ${S.method === m ? "selected" : ""}>${m}</option>`).join("")}</select></label></div>
     <label class="field"><span class="label">Off-season weight · <span class="num" id="offWv">${S.offW.toFixed(2)}</span></span><input id="sOffW" type="range" min="0" max="1" step="0.05" value="${S.offW}"><span class="note">0 uses only past ${S.season} rounds (most accurate, least data). 1 treats Fall and Spring alike.</span></label>
     <label class="field"><span class="label">Recency decay per year · <span class="num" id="decv">${S.decay.toFixed(2)}</span></span><input id="sDecay" type="range" min="0.3" max="1" step="0.05" value="${S.decay}"><span class="note">Each year further back multiplies a round's weight by this.</span></label>
     <table><thead><tr><th>Round</th><th>Include</th><th class="r">Years back</th><th class="r">Weight</th><th class="r">Prices</th></tr></thead><tbody>
       ${tm.map(t => `<tr><td>${esc(t.label)}</td><td><input type="checkbox" class="chk" data-inc="${esc(t.label)}" ${t.inc ? "checked" : ""}></td><td class="r num">${t.yb}</td><td class="r num">${t.w.toFixed(3)}</td><td class="r num">${DATA.prices.filter(p => p[0] === t.label).length}</td></tr>`).join("")}
     </tbody></table>
     <p class="note">Rounds at or after the target term get weight 0, so a round's own results never leak into its forecast.</p>
   </div>
   <div class="card cardpad" style="display:grid;gap:12px">
     <h2 style="font-size:22px;font-weight:800">Your plan</h2>
     <label class="field" style="flex-direction:row;align-items:center;gap:8px"><input id="sLive" type="checkbox" class="chk" ${S.useLive ? "checked" : ""}> Use Spring 2027 times and sections from Penn Course Review</label>
     <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" id="btnExportJSON">Back up plan (.json)</button><label class="btn small" style="display:inline-flex;align-items:center">Restore from backup<input id="importFile" type="file" accept="application/json,.json" hidden></label>
     <button class="btn small" id="btnReset">Reset to example plan</button>${IS_OWNER && DATA.short.length ? `<button class="btn small" id="btnResetMine">Reset to my workbook plan</button>` : ""}</div>
     <div id="resetConfirm"></div>
     <p class="note">${DB && USER_ID ? "Your plan saves to your Claude account and is private to you. Other people who open this page get their own plan." : "Your plan saves in this browser only. Back it up to move it to another device."}</p>
     <div class="prose"><h3>How Course Match uses your numbers</h3>
     <p>Clearing prices come from everyone's reported utilities. Course Match then buys the schedule with the highest total of utility × CU among those whose prices fit your budget: at most one section per course, one course per time slot, no more than your CU max. A utility of 0 is never scheduled.</p>
     <p>Utilities aren't bids. A section that clears at 0 costs 0, and a high utility doesn't hold tokens for a course. Sizing utilities to clear a price is a planning heuristic. The Simulate tab shows what the real rule would buy at each price level.</p>
     <p>Half-credit courses count half: 100 points on a 0.5 CU section is worth 50. Pair adjustments can add up to 100 × the pair's CUs, or rule a pair out.</p>
     <h3>Data</h3>
     <p>Clearing prices: ${DATA.prices.length.toLocaleString()} section-rounds, Spring 2024 to Fall 2026. Section list: the Spring 2026 Course Match list as a stand-in, plus manual adds. Spring 2027 sections, times and ratings: Penn Course Review public API, ${Object.keys(PCR.courses).length} courses as of ${PCR.asOf}. Offerings list: Wharton's tentative Spring 2027 listing (Aug 13, 2026).</p></div>
   </div></div>`;
}

/* ---------- events ---------- */
function update(fn, opts = {}){ fn(); recompute(); if (opts.ledgerOnly) renderLedger(); else renderAll(); persist(); }
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "inBudget") update(() => S.budget = Math.max(0, +t.value || 0), { ledgerOnly: true });
  else if (t.id === "inMaxCU") update(() => S.maxCU = Math.max(0, +t.value || 0), { ledgerOnly: true });
  else if (t.dataset.act === "u") { const id = t.closest("tr").dataset.id; const r = S.rows.find(r => r.id === id); update(() => { r.u = t.value === "" ? null : Math.max(0, Math.min(100, Math.round(+t.value))); }, { ledgerOnly: true }); }
  else if (t.id === "cq") { CF.q = t.value; renderCatalog(); }
  else if (t.id === "sOffW") { $("#offWv").textContent = (+t.value).toFixed(2); update(() => S.offW = +t.value); }
  else if (t.id === "sDecay") { $("#decv").textContent = (+t.value).toFixed(2); update(() => S.decay = +t.value); }
  else if (t.id === "inBuf") { S.buffer = Math.max(0, +t.value || 0); persist(); renderFit(); }
  else if (t.id === "inRuns") { S.mcRuns = Math.max(50, Math.min(3000, +t.value || 500)); persist(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "inBudget" || t.id === "inMaxCU" || t.dataset.act === "u") renderAll();
  else if (t.id === "inBench") update(() => S.bench = t.value);
  else if (t.dataset.act === "tgt") { const r = S.rows.find(r => r.id === t.closest("tr").dataset.id); update(() => r.tgt = t.checked); }
  else if (t.dataset.act === "q") { const r = S.rows.find(r => r.id === t.closest("tr").dataset.id); update(() => r.q = t.value); }
  else if (t.id === "inSpread") { S.spread = t.value; persist(); renderFit(); }
  else if (t.id === "cd") { CF.dept = t.value; renderCatalog(); }
  else if (t.id === "cs") { CF.sort = t.value; renderCatalog(); }
  else if (t.id === "cl") { CF.listed = t.checked; renderCatalog(); }
  else if (t.id === "sSeason") update(() => S.season = t.value);
  else if (t.id === "sYear") update(() => S.year = +t.value || 2027);
  else if (t.id === "sMethod") update(() => S.method = t.value);
  else if (t.dataset.inc) update(() => S.include[t.dataset.inc] = t.checked);
  else if (t.id === "sLive") update(() => S.useLive = t.checked);
  else if (t.id === "pn") { $("#pv").disabled = t.checked; }
  else if (t.id === "importFile" && t.files[0]) { const fr = new FileReader(); fr.onload = () => { try { const o = JSON.parse(fr.result); if (!Array.isArray(o.rows)) throw 0; update(() => { S = normalizeState(o); }); toast("Plan restored."); } catch (er) { toast("That file isn't a plan backup from this page."); } }; fr.readAsText(t.files[0]); }
});
function addSid(raw){
  const sid = String(raw || "").trim().toUpperCase().replace(/\s+/g, "");
  const m = /^([A-Z]{3,4})-?(\d{4})-?(\d{3})$/.exec(sid); if (!m) return "Use the form DEPT-1234-001.";
  const id = `${m[1]}-${m[2]}-${m[3]}`; if (S.rows.some(r => r.sid === id)) return id + " is already on your shortlist.";
  const known = CAT_BY_SID[id] || liveSection(id);
  update(() => { S.rows.push({ id: uid(), sid: id, u: null, tgt: false, q: "Full", days: null, st: null, et: null }); });
  return known ? "" : `Added ${id}, but it isn't in the catalog or the Spring 2027 schedule.`;
}
document.addEventListener("click", async e => {
  const t = e.target.closest("button,a,tr[data-open],[data-close]"); if (!t) return;
  if (t.matches("[data-close]")) { closeDrawer(); return; }
  if (t.dataset.act === "del") { const id = t.closest("tr").dataset.id; update(() => S.rows = S.rows.filter(r => r.id !== id)); return; }
  if (t.dataset.act === "open") { openCourse(t.dataset.cid, t.dataset.sid); return; }
  if (t.dataset.open) { openCourse(t.dataset.open); return; }
  if (t.dataset.addsid) { const msg = addSid(t.dataset.addsid); toast(msg || `Added ${t.dataset.addsid} to your shortlist.`); t.outerHTML = '<span class="pill ok">added</span>'; return; }
  if (t.dataset.guess) { const v = $("#guessIn").value; update(() => { if (v === "") delete S.guesses[t.dataset.guess]; else S.guesses[t.dataset.guess] = Math.max(0, +v); }); toast("Price guess saved."); openCourse(cidOf(t.dataset.guess), t.dataset.guess); return; }
  if (t.dataset.refresh) { closeDrawer(); await syncPCR([t.dataset.refresh]); openCourse(t.dataset.refresh); return; }
  if (t.matches("[data-paste]")) { $("#pasteBox").hidden = false; $("#pasteTxt").focus(); return; }
  if (t.dataset.applypaste) { try { const j = normPCR(extractJSON($("#pasteTxt").value)); const cid = t.dataset.applypaste; update(() => { delete j.syl; S.live[j.cid || cid] = j; delete S.liveMissing[cid]; }); toast("Updated from pasted data."); openCourse(cid); } catch (er) { $("#pasteMsg").textContent = er.message || "Couldn't read that."; } return; }
  if (t.dataset.delpair) { update(() => S.pairs.splice(+t.dataset.delpair, 1)); return; }
  switch (t.id) {
    case "btnAdd": { const msg = addSid($("#addInput").value); $("#addMsg").textContent = msg; if (!msg || msg.startsWith("Added")) $("#addInput").value = ""; break; }
    case "btnFit": fitOpen = !fitOpen; renderFit(); break;
    case "btnCloseFit": fitOpen = false; renderFit(); break;
    case "btnApplyFit": if (fitRes) { const u = fitRes.u, T = fitRes.T; update(() => T.forEach((x, i) => { x.r.u = u[i]; })); fitOpen = false; renderFit(); toast("Utilities updated."); } break;
    case "btnSync": { const cids = [...new Set(S.rows.map(r => cidOf(r.sid)))]; if (cids.length) syncPCR(cids); else toast("Add sections to your shortlist first."); break; }
    case "btnClearEx": update(() => { S.rows = []; S.example = false; }); break;
    case "btnKeepEx": update(() => { S.example = false; }); break;
    case "btnMC": runMC(); break;
    case "btnPair": { const a = $("#pa").value, b = $("#pb").value; if (!a || !b || a === b) { toast("Pick two different sections."); break; } update(() => S.pairs.push({ a, b, never: $("#pn").checked, adj: $("#pn").checked ? 0 : +$("#pv").value || 0 })); break; }
    case "btnExport": case "btnCopy": {
      const rows = R.rows.filter(x => x.u > 0).sort((a, b) => b.u - a.u);
      const csv = "Section ID,Title,Utility,CU,In target\n" + rows.map(x => [x.sid, `"${String(x.title || "").replace(/"/g, '""')}"`, x.u, x.cu, x.tgt ? "yes" : "no"].join(",")).join("\n");
      if (t.id === "btnCopy") { try { await navigator.clipboard.writeText(rows.map(x => `${x.sid}\t${x.u}`).join("\n")); toast("Copied " + rows.length + " utilities."); } catch (er) { toast("Copy isn't allowed here. Use Export instead."); } break; }
      await saveFile(`coursematch-utilities-${S.season.toLowerCase()}-${S.year}.csv`, csv, "text/csv"); break; }
    case "btnExportJSON": await saveFile("coursematch-plan.json", JSON.stringify(S, null, 1), "application/json"); break;
    case "btnReset": case "btnResetMine": $("#resetConfirm").innerHTML = `<div class="banner warn">This replaces your shortlist, utilities and settings. <button class="btn small" id="${t.id === "btnReset" ? "btnReset2" : "btnResetMine2"}">Replace my plan</button><button class="btn small ghost" onclick="this.closest('.banner').remove()">Cancel</button></div>`; break;
    case "btnReset2": update(() => { S = defaultState(false); }); toast("Plan reset."); break;
    case "btnResetMine2": update(() => { S = defaultState(true); }); toast("Plan reset to your workbook."); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#drawerHost").innerHTML) closeDrawer();
  if (e.key === "Enter" && e.target.id === "addInput") { e.preventDefault(); $("#btnAdd").click(); }
  if (e.key === "Enter" && e.target.closest && e.target.closest("tr.click") && e.target.matches("tr")) openCourse(e.target.dataset.open);
});
window.addEventListener("hashchange", () => { closeDrawer(); renderTab(); });

recompute(); renderAll(); setSave("Loading…");
boot().catch(() => { setSave("Saved in this browser"); });
</script>

</body>
</html>
