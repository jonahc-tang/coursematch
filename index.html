m=202610&course=MGMT7310001","desc":"The course is designed to meet the needs of future managers, entrepreneurs, consultants and investors who must analyze and develop business strategies in technology-based industries. The emphasis is on learning conceptual models and frameworks to help navigate the complexity and dynamism in such industries. This is not a course in new product development or in using information technology to improve business processes and offerings. We will take a perspective of both established and emerging firms competing through technological innovations, and study the key strategic drivers of value creation and appropriation in the context of business ecosystems. The course uses a combination of cases, simulation and readings. The cases are drawn primarily from technology-based industries. Note, however, that the case discussions are mainly based on strategic (not technical) issues. Hence, a technical background is not required for fruitful participation.\nWharton MBA course. Course must be taken for a grade. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MKTG-7390","sid":"MKTG-7390-401","cu":1,"title":"Visual Marketing","days":"M, W","st":615,"et":704,"cq":2.84,"iq":3.08,"diff":1.72,"work":1.82,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Barbara E. Kahn","cq":2.836,"iq":3.172,"d":1.716,"w":1.818},{"n":"Elizabeth Nan. Johnson","cq":2.836,"iq":2.996,"d":1.716,"w":1.818}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MKTG7390401","desc":"As consumers, we are constantly exposed to advertisements and experience visual messages from product packages in stores, retail displays, and products already owned. In essence, visual marketing collateral is omnipresent and is an essential part of corporate visual identity, strategy, branding, and communication. Some of this falls to creative graphic design, but advertising, design, and marketing can also be significantly enhanced by knowledge of how visual information and its presentation context can be optimized to deliver desirable and advantageous messages and experiences. This course will emphasize how to measure, interpret, and optimize visual marketing. This course will use lectures, discussions, exercises and a group project, to help students understand the underlying processes that influence our visual perception and visual cognition. Students will learn about the theoretical processes and models that influence, attention and visual fluency. Students will also be exposed to eye-tracking instruments that help measure eye movement. Finally, we will explore how visual stimuli can influence consumer memory, persuasion, and choice. We will examine practical applications in marketing, advertising, packaging, retail, and design contexts.\nNOTICE TO MBA STUDENTS: MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. *************************************************************\nNOTICE TO NON-MBA STUDENTS: If there are any seats left after the MBA students register through Course Match, the instructor may choose to admit a few non-MBA students. Only students who have entered a permission request in Path@Penn will be considered. (DO NOT EMAIL THE INSTRUCTOR). The availability of seats will not be known until early January. If there are seats available at that time the department will email you to see if you are still interested in taking the course. This course typically fills to capacity, and it is highly unlikely that any non-MBA students would be granted permission, so plan accordingly by signing up for a back-up course."},{"src":"2026A list (proxy)","sem":"2026A","cid":"STAT-7730","sid":"STAT-7730-001","cu":1,"title":"Data Science Using ChatGPT","days":"T, R","st":930,"et":1019,"cq":2.83,"iq":3.19,"diff":2.74,"work":2.41,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Krishna Padmanabhan","cq":2.83,"iq":3.19,"d":2.74,"w":2.41}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=STAT7730001","desc":"Large Language Models (LLMs) such as ChatGPT are reshaping how statisticians approach data analysis: enabling a shift from manual coding and computation to strategic thinking in statistical modeling, interpretation, and decision-making. This course develops advanced statistical skills by integrating AI tools to enhance statistical methodologies. It offers an intermediate-level exploration of modern statistical techniques, including generative classification, time series modeling, Bayesian inference, and survival analysis. Using structured prompt engineering techniques, ChatGPT will serve primarily as a computational and programming assistant. Students will focus on deepening their conceptual understanding and applying methods in practical contexts. The course emphasizes shifting attention from coding mechanics to statistical insight and real-world application through case studies. A mixed assessment strategy will be used - some evaluations incorporating ChatGPT and others in traditional paper-based formats to ensure students build both AI-assisted and independent competencies for modern statistical practice.\nThis is an MBA Course. Auditors need permission. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions.\n\n*********************************************************************** \nNOTICE TO OTHER (NON-MBA) GRAD STUDENTS: After MBA Course Match runs, there may be seats available for non-MBA graduate students. You should submit a permission request for the course in Path@Penn. We'll start processing permission requests in January.\n"},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-7500","sid":"FNCE-7500-001","cu":1,"title":"Vent Cap & Fnce Innovat","days":"T, R","st":510,"et":599,"cq":2.82,"iq":3.09,"diff":3.05,"work":3.11,"onList":"Yes","listCU":1,"listSec":3,"insts":[{"n":"Jonathan Zandberg","cq":2.822,"iq":3.086,"d":3.047,"w":3.107}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE7500003","desc":"This course covers the finance of technological innovation, with a focus on the valuation tools useful in the venture capital industry. These tools include the \"venture capital method,\" comparables analysis, discounted cash flow analysis, contingent-claims analysis. The primary audience for this course is finance majors interested in careers in venture capital or in R&D-intensive companies in health care or information technology.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. Note: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/)\nto request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. Prerequisites: FNCE 6110.\n"},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-7500","sid":"FNCE-7500-002","cu":1,"title":"Vent Cap & Fnce Innovat","days":"T, R","st":615,"et":704,"cq":2.82,"iq":3.09,"diff":3.05,"work":3.11,"onList":"Yes","listCU":1,"listSec":3,"insts":[{"n":"Jonathan Zandberg","cq":2.822,"iq":3.086,"d":3.047,"w":3.107}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE7500003","desc":"This course covers the finance of technological innovation, with a focus on the valuation tools useful in the venture capital industry. These tools include the \"venture capital method,\" comparables analysis, discounted cash flow analysis, contingent-claims analysis. The primary audience for this course is finance majors interested in careers in venture capital or in R&D-intensive companies in health care or information technology.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. Note: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/)\nto request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. Prerequisites: FNCE 6110.\n"},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-7500","sid":"FNCE-7500-003","cu":1,"title":"Vent Cap & Fnce Innovat","days":"T, R","st":825,"et":914,"cq":2.82,"iq":3.09,"diff":3.05,"work":3.11,"onList":"Yes","listCU":1,"listSec":3,"insts":[{"n":"Jonathan Zandberg","cq":2.822,"iq":3.086,"d":3.047,"w":3.107}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE7500003","desc":"This course covers the finance of technological innovation, with a focus on the valuation tools useful in the venture capital industry. These tools include the \"venture capital method,\" comparables analysis, discounted cash flow analysis, contingent-claims analysis. The primary audience for this course is finance majors interested in careers in venture capital or in R&D-intensive companies in health care or information technology.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. Note: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/)\nto request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. Prerequisites: FNCE 6110.\n"},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-8170","sid":"MGMT-8170-001","cu":1,"title":"Global Growth of Emerg","days":"T, R","st":825,"et":914,"cq":2.8,"iq":3.27,"diff":1.47,"work":1.78,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Natalie Carlson","cq":2.803333333,"iq":3.266666667,"d":1.473333333,"w":1.783333333}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT8170001","desc":"Emerging firms are a critical element of economic growth, and a key source of gains in innovation and social welfare. This course is designed to depart from the U.S.-centric conversation on startups - with its outsized focus on Silicon Valley - and train a critical eye on some of the unique innovations emerging from new regional hotspots across the globe, with a particular focus on developing and emerging economies. We will discuss the challenges faced by founders in different global contexts, the components of a robust institutional ecosystem, and the ways in which creative solutions may flourish in response to local problems. Along the way, students will gain a virtual view into global startup communities, and personalized insights from firm founders operating around the world - from Bogota to Nairobi to Jakarta. The course will be structured in three primary parts. The first and longest section will discuss the Key Challenges for emerging firm growth across the globe, such as access to talent and resources, political risk, and legal institutions. The second section will highlight particularly active areas of Context-Driven Innovation that are thriving in various regions, such as financial technology, mobile health products, and clean energy. The final section will train Regional Spotlights on different geographic areas in turn, so that we may focus on the challenges and opportunities specific to various parts of the world. This course is relevant to both U.S. and non-U.S. students, and it is expected that students will bring their own backgrounds and experiences to contribute to lively class discussions. The course will culminate with a group project done in teams of four, in which groups will give short presentations to the class.\nWharton MBA Course. Course must be taken for a grade. MBA students must request enrollment for this class through Course Match and should not use the “Add to Cart” or “Request Permission” functions. Auditors need permission."},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-7570","sid":"FNCE-7570-401","cu":1,"title":"Foundations of Asset Pricing","days":"M, W","st":615,"et":704,"cq":2.8,"iq":3.1,"diff":3.89,"work":2.78,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Jessica A. Wachter","cq":2.8,"iq":3.1,"d":3.89,"w":2.78}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE7570401","desc":"This course will cover methods and topics that form the foundations of modern asset pricing. These include: investment decisions under uncertainty, mean-variance theory, capital market equilibrium, arbitrage pricing theory, state prices, dynamic programming, and risk-neutral valuation as applied to option prices and fixed-income securities. Upon completion of this course, students should acquire a clear understanding of the major principles concerning individuals' portfolio decisions under uncertainty and the valuations of financial securities. FNCE 7050 is recommended but not required.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. Note: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/) to request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. Prerequisites: FNCE 6110."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MKTG-6130","sid":"MKTG-6130-001","cu":0.5,"title":"Stratgic Mktg Simulation","cq":2.78,"iq":2.98,"diff":2.25,"work":2.56,"onList":"Yes","listCU":0.5,"listSec":4,"insts":[{"n":"Robert J. Meyer","cq":2.78125,"iq":2.9825,"d":2.2475,"w":2.56125}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MKTG6130004","desc":"Building upon Marketing 611, Marketing 613 is an intensive immersion course designed to develop skills in formulating and implementing marketing strategies for brands and businesses. The central activity will be participation in a realistic integrative product management simulation named SABRE. In SABRE, students will form management teams that oversee all critical aspects of modern product management: the design and marketing of new products, advertising budgeting and design, sales force sizing and allocation, and production planning. As in the real world, teams will compete for profitability, and the success that each team has in achieving this goal will be a major driver of the class assessment. The SABRE simulation is used to convey the two foci of learning in the course: the changing nature of strategic problems and their optimal solutions as industries progress through the product life cycle, and exposure to the latest analytic tools for solving these problems. Specifically, SABRE management teams will receive training in both how to make optimal use of marketing research information to reduce uncertainty in product design and positioning, as well as decision support models to guide resource allocation.\nMBA Course. Simulation. This course meets on Friday and Saturday for two weekends: March 20, 21, 27, and 28, 2026. Wharton MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. *************************************************************\nNOTICE TO NON-MBA STUDENTS: If there are any seats left after the MBA students register through Course Match, the instructor may choose to admit a few non-MBA students. Only students who have entered a permission request in Path@Penn will be considered. (DO NOT EMAIL THE INSTRUCTOR). The availability of seats will not be known until mid-March. If there are seats available at that time th ted permission, so plan accordingly by signing up for a back-up course.\n\n"},{"src":"2026A list (proxy)","sem":"2026A","cid":"MKTG-8060","sid":"MKTG-8060-401","cu":0.5,"title":"Retail Merchandising","days":"M","st":930,"et":1109,"cq":2.78,"iq":3.03,"diff":1.83,"work":1.84,"onList":"Yes","listCU":0.5,"listSec":1,"insts":[{"n":"Bryan Quinn. Eshelman","cq":2.78,"iq":3.031666667,"d":1.83,"w":1.838333333}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MKTG8060401","desc":"As a follow-on to Principles of Retailing (MKTG 7250), this course delves more deeply into both the fundamentals and recent trends in the end-to-end retail merchandising process. The objective is to familiarize students with both the theory and practice of planning, buying, designing, pricing, and displaying merchandise to consumers. This knowledge will be fundamental to careers working for retailers themselves (e-commerce or omnichannel), but also in consulting to retailers, in banking or investing in the retail sector, or even starting their a brand or retail concept. Those seeking more depth in sourcing, distribution, fulfillment, and store/site operations should consider taking Retail Supply Chain Management (OIDD 6970).\nCourse must be taken for a letter grade. Attendance on the first day of class is mandatory. NOTICE TO MBA STUDENTS: MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. *************************************************************\nNOTICE TO NON-MBA STUDENTS: If there are any seats left after the MBA students register through Course Match, the instructor may choose to admit a few non-MBA students. Only students who have entered a permission request in Path@Penn will be considered. (DO NOT EMAIL THE INSTRUCTOR). The availability of seats will not be known until late December. Please view https://mba-inside.wharton.upenn.edu/course-registration-for-non-mba-students/ for a list of courses with seats available to non-MBA students. If there are seats available at that time the department will either approve your permission request or send you an email you to see if you are still interested in taking the course (if there are more requests than available seats.) The last day to register for this class is January 26. This course follows the MBA Calendar, not the Penn Academic Calendar. Non-MBA students will not be able to drop and re add this course past that date, so use care when adjusting your schedule."},{"src":"2026A list (proxy)","sem":"2026A","cid":"OIDD-6120","sid":"OIDD-6120-006","cu":0.5,"title":"Business Analytics","days":"T, R","st":615,"et":704,"cq":2.76,"iq":3.15,"diff":2.34,"work":2.34,"onList":"Yes","listCU":0.5,"listSec":2,"insts":[{"n":"Sergei Savin","cq":2.762857143,"iq":3.153928571,"d":2.336785714,"w":2.340357143}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=OIDD6120008","desc":"\"Managing the Productive Core: Business Analytics\" is a course on business analytics tools and their application to management problems. Its main topics are optimization, decision making under uncertainty, and simulation. The emphasis is on business analytics tools that are widely used in diverse industries and functional areas, including operations, finance, accounting, and marketing.\nWharton MBA course. Course must be taken for a grade. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"OIDD-6120","sid":"OIDD-6120-008","cu":0.5,"title":"Business Analytics","days":"T, R","st":825,"et":914,"cq":2.76,"iq":3.15,"diff":2.34,"work":2.34,"onList":"Yes","listCU":0.5,"listSec":2,"insts":[{"n":"Sergei Savin","cq":2.762857143,"iq":3.153928571,"d":2.336785714,"w":2.340357143}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=OIDD6120008","desc":"\"Managing the Productive Core: Business Analytics\" is a course on business analytics tools and their application to management problems. Its main topics are optimization, decision making under uncertainty, and simulation. The emphasis is on business analytics tools that are widely used in diverse industries and functional areas, including operations, finance, accounting, and marketing.\nWharton MBA course. Course must be taken for a grade. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MKTG-7680","sid":"MKTG-7680-402","cu":0.5,"title":"Contagious","days":"M, W","st":615,"et":704,"cq":2.75,"iq":3.1,"diff":1.44,"work":1.87,"onList":"Yes","listCU":0.5,"listSec":3,"insts":[{"n":"Jonah A. Berger","cq":2.746666667,"iq":3.103333333,"d":1.443333333,"w":1.87}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MKTG7680406","desc":"Why do some products catch on and achieve huge popularity while others fail? Why do some services and apps spread like wildfire while others languish? And what makes certain ideas stick while others fail?\nThis course looks at these and other topics as it examines why things catch on. Marketers want their product to be popular, organizations want their initiatives to catch on, and entrepreneurs want their ideas to stick. Building on research from psychology, sociology, marketing, and economics, the course explores characteristics of products, services, and ideas that lead them to catch on, what makes ideas stick, and how social dynamics shape success. We’ll talk about viral marketing, growth strategies, the role of social media, and influencers. Whether you have a product, service, or idea you want to catch on, or just want to better understand social epidemics, this course will shed light on what drives success.\nNOTICE TO MBA STUDENTS: MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. *************************************************************\nNOTICE TO NON-MBA STUDENTS: If there are any seats left after the MBA students register through Course Match, the instructor may choose to admit a few non-MBA students. Only students who have entered a permission request in Path@Penn will be considered. (DO NOT EMAIL THE INSTRUCTOR). The availability of seats will not be known until mid-March. If there are seats available at that time the department will email you to see if you are still interested in taking the course."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MKTG-7680","sid":"MKTG-7680-404","cu":0.5,"title":"Contagious","days":"M, W","st":720,"et":809,"cq":2.75,"iq":3.1,"diff":1.44,"work":1.87,"onList":"Yes","listCU":0.5,"listSec":3,"insts":[{"n":"Jonah A. Berger","cq":2.746666667,"iq":3.103333333,"d":1.443333333,"w":1.87}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MKTG7680406","desc":"Why do some products catch on and achieve huge popularity while others fail? Why do some services and apps spread like wildfire while others languish? And what makes certain ideas stick while others fail?\nThis course looks at these and other topics as it examines why things catch on. Marketers want their product to be popular, organizations want their initiatives to catch on, and entrepreneurs want their ideas to stick. Building on research from psychology, sociology, marketing, and economics, the course explores characteristics of products, services, and ideas that lead them to catch on, what makes ideas stick, and how social dynamics shape success. We’ll talk about viral marketing, growth strategies, the role of social media, and influencers. Whether you have a product, service, or idea you want to catch on, or just want to better understand social epidemics, this course will shed light on what drives success.\nNOTICE TO MBA STUDENTS: MBA students m w these technologies provide managers new ways to enact control and to induce commitment – and how workers (both employees and contractors) react. In the third module “Technology and Policy” we will examine the ethics of algorithms and artificial intelligence, proposals for a “universal basic income” (UBI) premised on the idea that technological change will lead to an unprecedented amount of job displacement, and the premise that “technology makes us dumber” by taking tasks away that have helped humans maintain a certain level of competence. Take this course to be ready to manage the strategic and analytic issues involving the design and implementation of technology at work - and if you want a glimpse into the future of your own work life. Students will be evaluated on class participation, in-class quizzes, written work and a group assignment.\nWharton MBA course. Course must be taken for a grade. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-7210","sid":"MGMT-7210-001","cu":1,"title":"Corp Dev: Merg & Acquis","days":"M, W","st":510,"et":599,"cq":2.68,"iq":2.91,"diff":1.89,"work":2.14,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Paul Michael. Nary","cq":2.684,"iq":2.911,"d":1.892,"w":2.142}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT7210002","desc":"This interactive, applied, and case-based course explores the various modes of corporate development available to managers to drive firm growth and change, including alliances, outsourcing, corporate venturing, and particularly mergers and acquisitions. The objectives are three-fold: (1) to arm the student with a set of tools to facilitate the selection of the appropriate growth strategy in a given situation; (2) to provide insights as to how to manage partnerships like alliances, outsourcing, and corporate venturing; and, (3) to develop a comprehensive framework for executing M&As, from initiation to implementation. The emphasis is on strategic and operational aspects of these transactions, rather than financial considerations. Please note that you must fulfill the prerequisites in order to enroll in this class."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-7210","sid":"MGMT-7210-002","cu":1,"title":"Corp Dev: Merg & Acquis","days":"M, W","st":615,"et":704,"cq":2.68,"iq":2.91,"diff":1.89,"work":2.14,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Paul Michael. Nary","cq":2.684,"iq":2.911,"d":1.892,"w":2.142}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT7210002","desc":"This interactive, applied, and case-based course explores the various modes of corporate development available to managers to drive firm growth and change, including alliances, outsourcing, corporate venturing, and particularly mergers and acquisitions. The objectives are three-fold: (1) to arm the student with a set of tools to facilitate the selection of the appropriate growth strategy in a given situation; (2) to provide insights as to how to manage partnerships like alliances, outsourcing, and corporate venturing; and, (3) to develop a comprehensive framework for executing M&As, from initiation to implementation. The emphasis is on strategic and operational aspects of these transactions, rather than financial considerations. Please note that you must fulfill the prerequisites in order to enroll in this class."},{"src":"2026A list (proxy)","sem":"2026A","cid":"REAL-8700","sid":"REAL-8700-001","cu":0.5,"title":"Real Estate Data Analytics","days":"T, R","st":825,"et":914,"cq":2.68,"iq":3.14,"diff":2.39,"work":2.17,"onList":"Yes","listCU":0.5,"listSec":1,"insts":[{"n":"Benjamin J. Keys","cq":2.68,"iq":3.14,"d":2.39,"w":2.17}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=REAL8700001","desc":"In real estate investment, data is used in a variety of ways to inform decision-making. The purpose of this course is to gain familiarity with analytical tools and techniques as they relate to guiding investment in primary real estate markets and capital markets. Students will learn statistical methods, data manipulation, data visualization, and apply business analytics tools to data on properties, mortgages, and macroeconomic indicators. A series of guest speakers will demonstrate how analytics is used in the industry, and the strengths and limitations of using data to guide investment decisions. The course will use data analytics to connect economics and finance concepts with real-world applications. The course will use the R software package, but relevant materials will be provided and no prior coding experience is necessary.\nThis class is open to non-Wharton students on a space-available basis. Non-Wharton students must place a permission request in the PATH system in order to be eligible to receive a permission to enroll. Wharton MBA Course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"HCMG-8450","sid":"HCMG-8450-001","cu":1,"title":"US Payer Provider Strat","days":"T","st":930,"et":1109,"cq":2.67,"iq":2.73,"diff":1.91,"work":1.98,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Bradley M. Fluegel","cq":2.616666667,"iq":2.829166667,"d":1.945,"w":2.006666667},{"n":"Atul Gupta","cq":2.727142857,"iq":2.622857143,"d":1.877142857,"w":1.961428571}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=HCMG8450001","desc":"This course, co-taught with Brad Fluegel (former Chief Strategy Officer at Aetna, Anthem, and Walgreens and presently on the boards of several health care firms, including Fitbit and Premera Blue Cross), provides an overview of the challenges facing payers and providers in US healthcare as well as the strategies they use (or should use) to succeed. We cover all major aspects of the healthcare sector as seen from the perspective of payers and providers, starting from their core products and services (consumer preferences and health plan design, provider quality), the market environment they operate in (regulation and the role of public insurers, payment reforms, rising costs, and consolidation), and their strategic and operational responses (new organization models, mergers and acquisitions, and new ventures). The pedagogy is accordingly a mix of faculty lectures and talks by senior industry leaders to balance theory and practice.\nMBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. \nPermission requests from non-MBA students will not be reviewed or acted upon until after the MBA students register, which will not occur until mid-January. See: https://mba-inside.wharton.upenn.edu/course-registration-for-non-mba-students/. If you want to be considered for a seat in this class enter a permission request in Path@Penn. Be sure to include why you want to take the course in your request. No further action is required. It is possible that there will not be enough open seats available to meet all permission request after MBAs register. Be sure you sign up for a backup course in the event that your permission request is denied."},{"src":"2026A list (proxy)","sem":"2026A","cid":"ACCT-7900","sid":"ACCT-7900-401","cu":1,"title":"Accounting for Entrepreneurs","days":"T, R","st":615,"et":704,"cq":2.67,"iq":2.96,"diff":2.29,"work":1.84,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Christopher D. Ittner","cq":2.67,"iq":2.96,"d":2.29,"w":1.84}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=ACCT7900401","desc":"This course covers the financial, managerial, and tax accounting issues and tools relevant to private, entrepreneurial companies as they progress from the earliest stages of the business through to the company’s exit, typically through a strategic buyer, a private equity firm, or via an IPO. Topics include the choice of organizational form; the development of the initial accounting infrastructure; the accounting issues that are frequently faced by entrepreneurs such as accounting for intangible assets, employee compensation, revenue recognition, and financing; the development of management and internal control systems; the establishment of monthly and yearly budgeting, financial forecasting, and cash management processes; and the accounting information required for fundraising and going public. The class is designed for students who intend to own, work for, or invest in entrepreneurial companies.\nAuditors need permission. Wharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"HCMG-8670","sid":"HCMG-8670-001","cu":0.5,"title":"Hc Entrepreneurship","days":"T","st":930,"et":1019,"cq":2.67,"iq":2.94,"diff":1.91,"work":2.31,"onList":"Yes","listCU":0.5,"listSec":1,"insts":[{"n":"Gary J. Kurtzman","cq":2.55875,"iq":2.691875,"d":2.034375,"w":2.345625},{"n":"Pitamber Devgon","cq":2.78,"iq":3.19,"d":1.79,"w":2.28}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=HCMG8670001","desc":"The course focuses on the creation, funding, and management of digital health, biotech, medtech, and other health services enterprises. The course is designed to supplement other offerings in the Health Care Systems and Management Departments for those students with entrepreneurial interest in such ventures, and will focus on special issues surrounding the conceptualization, planning, diligence, and capitalization of these ventures and also includes management and compensation practices. In addition, course offers methods for self-assessment & development of business models and plans, techniques for technology assessment and strategy, develops foundation for capitalization and partnering strategies, and creates a basis for best practices in company launch and plan execution. Students must apply to take this course. Please see the Health Care Management Department for the application.\nApplication required"},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-8090","sid":"MGMT-8090-001","cu":0.5,"title":"Priv. Equity Emerg. Mar","days":"M, W","st":825,"et":914,"cq":2.66,"iq":2.83,"diff":2,"work":2.44,"onList":"Yes","listCU":0.5,"listSec":1,"insts":[{"n":"Peter L. Tropper","cq":2.662,"iq":2.834,"d":2.002,"w":2.441}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT8090001","desc":"This course investigates the private equity industry in emerging markets. The goal of the course is to give students a realistic understanding of the roles, responsibilities and analytical skills required of market practitioners, as well as the tensions that arise between various stakeholders, including government officials, investors, entrepreneurs and the press. The underlying premise is that the basic rules for private equity in those countries are similar to the rules in more industrialized countries, but market participants face a broader range of issues in areas such as valuations, governance, legal structures, contract enforcement and regulatory transparency. To provide students with a practical grasp of the issues, classes will be a mix of lectures, expert guest speakers and business cases. Cases will highlight the challenges and tasks at each stage of the investment cycle, such as structuring and launching a new fund, originating new deals, conducting due diligence, creating value, monitoring the performance of portfolio companies and exiting. Each class will focus on a specific topic, ranging from the basics of how and why private equity funds operate to complex issues such as fund governance and adding value to family firms.\nWharton MBA Course. Attendance at first day L databases to query and retrieve data, through data wrangling, reshaping, summarizing, analyzing and ultimately reporting their results. Competency in Python is a critical skill for students interested in data science. Prerequisites: No prior programming experience is expected, but statistics, through the level of multiple regression is required. This requirement may be fulfilled with MBA courses such as STAT 6130/6210; or by waiving MBA statistics.\nThis is an MBA Course. Auditors need permission. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions.\n\n*********************************************************************** \nNOTICE TO OTHER (NON-MBA) GRAD STUDENTS: After MBA Course Match runs, there may be seats available for non-MBA graduate students. You should submit a permission request for the course in Path@Penn. We'll start processing permission requests in January.\n"},{"src":"2026A list (proxy)","sem":"2026A","cid":"MKTG-7520","sid":"MKTG-7520-402","cu":0.5,"title":"Marketing Analytics","days":"M, W","st":720,"et":809,"cq":2.63,"iq":3.04,"diff":2.66,"work":2.37,"onList":"Yes","listCU":0.5,"listSec":1,"insts":[{"n":"Eric Eisenstein","cq":2.63,"iq":3.035,"d":2.66,"w":2.37}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MKTG7520402","desc":"Companies are currently spending millions of dollars on data-gathering initiatives, but few are successfully capitalizing on all this data to generate revenue and increase profit. Converting data into increased business performance requires the ability to extract insights from data through analytics.\nThis course covers the three pillars of analytics – descriptive, predictive and prescriptive – within the marketing context.\nDescriptive Analytics examines different types of data and how they can be visualized, ultimately helping you communicate your findings and strengthen your team’s or organization’s decision making.\nPredictive Analytics explores the use of data for forecasting. You will learn to utilize various tools, including regression analysis, to estimate relationships among variables and predict future behavior.\nPrescriptive Analytics takes you through the final step — formulating concrete recommendations. These recommendations can be directed toward a variety of marketing actions, including pricing and social-platform outreach.\nStudents will be exposed to several methods such as linear regression, logistic regression, multinomial regression, machine learning methods (e.g., neural networks and random forests). We will learn how to employ these methods for such managerial decisions as demand forecasting, pricing, and valuing customers.\nOverall, you will develop a data analytics mindset, learn new tools, and understand how to convert numbers into actionable insights.\nNOTICE TO MBA STUDENTS: MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. *************************************************************\nNOTICE TO NON-MBA STUDENTS: If there are any seats left after the MBA students register through Course Match, the instructor may choose to admit a few non-MBA students. Only students who have entered a permission request in Path@Penn will be considered. (DO NOT EMAIL THE INSTRUCTOR). The availability of seats will not be known until late December. Please view https://mba-inside.wharton.upenn.edu/course-registration-for-non-mba-students/ for a list of courses with seats available to non-MBA students. If there are seats available at that time the department will either approve your permission request which will allow you to register yourself through Path@Penn. The last day to register for this class is January 27. This course follows the MBA Calendar, not the Penn Academic Calendar. Non-MBA students will not be able to drop and re add this course past that date, so use care when adjusting your schedule."},{"src":"2026A list (proxy)","sem":"2026A","cid":"HCMG-8680","sid":"HCMG-8680-001","cu":0.5,"title":"Priv Sec Role Glob Hlth","days":"M","st":1035,"et":1124,"cq":2.63,"iq":2.85,"diff":1.61,"work":1.86,"onList":"Yes","listCU":0.5,"listSec":1,"insts":[{"n":"Stephen M. Sammut","cq":2.62625,"iq":2.846875,"d":1.613125,"w":1.8575}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=HCMG8680001","desc":"Issues surrounding global health have captivated the attention of the public sector and foundations for many decades. Many of their initiatives are realizing progress on the health-related Millennium Development Goals. The private sector has been less engaged in global health, but has a significant role to play in providing resources and in building infrastructure, human resource capacity and sustainability. This course explores entrepreneurial and other private sector solutions for health services and access to medicines and technologies in the developing world and other underserved areas. The course also encompasses study of creative programs to engage the private sector in development of vaccines and medicines for tropical and neglected diseases. Furthermore, the course addresses novel care systems and therapeutic strategies for the rapidly growing burden of chronic, non-communicable diseases in the developing world. In short, the course builds on the content of conventional global health courses from a managerial and entrepreneurial perspective. Learning is driven through readings, class discussion and a series of guest speakers representing a wide range of global health issues. Evaluation is largely based on a student group project.\nMBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. Undergraduates need permission from instructor."},{"src":"2026A list (proxy)","sem":"2026A","cid":"LGST-8050","sid":"LGST-8050-401","cu" f the consumer at the center. As has been the case in other industries, this new business model will be based on a foundation of diverse, potent, and well implemented information technology. This course will help prepare students to lead a digital health future. Specifically, the course will cover three major areas. (1)The context of health care information technology: the size, composition and evolution of the digital health market; federal government agencies, and related regulations, that shape the market; leadership roles and factors that enable healthcare organizations to effectively implement and leverage information technology. (2)Emerging technologies that will fuel the transformation of healthcare: artificial intelligence and advanced analytics; interoperability; telehealth; consumer-directed digital health; use of behavioral economics to influence patient and provider decisions. (3)Digital health use by specific sectors of the healthcare industry: healthcare providers; health plans; retail-based primary care; life sciences; wellness and chronic disease management. The course will include lectures from industry leaders who will share their ideas and experiences.\nMBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. \nPermission requests from non-MBA students will not be reviewed or acted upon until after the MBA students register, which will not occur until mid-January. See: https://mba-inside.wharton.upenn.edu/course-registration-for-non-mba-students/. If you want to be considered for a seat in this class enter a permission request in Path@Penn. Be sure to include why you want to take the course in your request. No further action is required. It is possible that there will not be enough open seats available to meet all permission request after MBAs register. Be sure you sign up for a backup course in the event that your permission request is denied.\nUndergradua .wharton.upenn.edu/syllabi/?term=202610&course=MKTG7600401","desc":"This course considers the role of antitrust law in facilitating and policing the business strategies of dominant firms and joint enterprises. We will examine technology-driven firms such as Amazon, Apple, Facebook, Google, Uber, and Microsoft, as well as disrupted industries such as the digital music industry. In each case, we will consider how firms adapted their strategies to rapidly changing technological environments and ask whether antitrust law served to promote or to hinder innovation and competitive development. Course coverage will range over all portions of the business economy in which competition and innovation are important, but emphasizing markets that have a significant technological component. We will also study a series of classic business cases in technology rich markets, including the American Can Company, Standard Oil, and DuPont. We will pay special attention to the role of intellectual property rights in fostering both individual and collaborative innovation.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. All permission requests should be directed to the Legal Studies Department."},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-6230","sid":"FNCE-6230-001","cu":0.5,"title":"Macroeconomics (Half CU)","days":"M, W","st":510,"et":599,"cq":2.44,"iq":2.93,"diff":2.72,"work":1.93,"onList":"Yes","listCU":0.5,"listSec":4,"insts":[{"n":"Anthony Emmanuel. Landry","cq":2.439375,"iq":2.930625,"d":2.716875,"w":1.93375}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE6230007","desc":"This half-semester course in Macroeconomics is intended for non-finance majors. The goal of this course is to provide the foundation needed to recognize and understand broad economic and financial movements in the global economy. Key topics include national incom sharp rise in cost of financing, destruction of an important asset, impact of global warming, or a liability suit can quickly squander the value created by firms. In extreme cases, risky outcomes can bankrupt a firm, as has happened recently to manufacturers of automobile parts and a variety of financial service firms. The events since the Global Financial Crisis also offer stark reminders that risk can impose significant costs on individuals, firms, governments, and societ6y as a whole. This course explores how individuals and firms assess and evaluate risk, examines the tools available to successfully manage risk, and discusses real-world phenomena that limit the desired amount of risk-sharing. Our focus is primarily on explaining the products and institutions that will serve you better when making decisisions in your future careers and lives."},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-7190","sid":"FNCE-7190-001","cu":1,"title":"Intl Financial Markets/Crypto","days":"T, R","st":615,"et":704,"cq":2.39,"iq":2.59,"diff":3.02,"work":2.79,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Mohammed Yasser. Boualam","cq":2.39,"iq":2.59,"d":3.02,"w":2.79}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE7190001","desc":"Major topics include foreign exchange rates, international money markets, currency and interest rate derivatives, international stock and bond portfolios, and cryptocurrencies. Students learn about the features of financial instruments and the motivations of market participants. The class focuses on risk management, investing, and arbitrage in these markets. In addition to course prerequisites, FNCE 6130 is recommended but not required.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. . \nNote: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/)\nto request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. Prerequisites: FNCE 6110."},{"src":"2026A list (proxy)","sem":"2026A","cid":"REAL-8750","sid":"REAL-8750-401","cu":1,"title":"Real Estate Disruptions","days":"T","st":930,"et":1109,"cq":2.35,"iq":2.37,"diff":2.13,"work":2.23,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Gilles Duranton","cq":2.3525,"iq":2.0225,"d":2.13,"w":2.2325},{"n":"Richard Mack","cq":2.3525,"iq":2.72,"d":2.13,"w":2.2325}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=REAL8750401","desc":"In the years before Covid, real Estate started to change dramatically for the first time in perhaps one hundred years. Covid and its aftermath led to further disruptions. This class will examine how technology is changing in many facets (all) of the industry. This course will address how technology has already changed the demand for real estate and how it will likely change how real estate is used, designed, developed, constructed, managed, leased, maintained, and financed. Among many questions to be considered: Can you crowd-fund real estate development? Will the office business become a part of hospitality? Can we build new buildings like we assemble legos? How will autonomous vehicles affect the demand for space and property values? What is the future of new data analytics services? What are the effects of working from home on cities and various real estate asset classes? This team-taught course will bring together a recognized industry leader and Wharton faculty. Includes a broad set of guest lecturers (Start-up entrepreneurs, incumbents, non-RE technology specialists, etc.). We believe there is no single approach to gaining insight into disruptions and change under uncertainty, so we will propose a mix of approaches, including in-depth case studies, interactions with guest lecturers who handle those issues daily, learning from economic history and other industries, and drawing from core economic concepts.\nAuditors need permission. This class is open to non-Wharton students on a space-available basis. Non-Wharton students must place a permission request in the PATH system in order to be eligible to receive a permission to enroll. Wharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the “Add to Cart” or “Request Permission” functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"REAL-8360","sid":"REAL-8360-401","cu":1,"title":"Int'l Housing Comparisns","days":"M, W","st":720,"et":809,"cq":2.32,"iq":2.62,"diff":2.56,"work":2.36,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Susan M. Wachter","cq":2.321666667,"iq":2.616666667,"d":2.555,"w":2.361666667}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=REAL8360401","desc":"This course analyzes housing finance systems and housing market outcomes across the globe. In the US, the course focuses on the development of securitization markets and addresses the current challenges of housing finance reform, including the future of Fannie Mae and Freddie Mac. Internationally, the course covers issues of access to housing and housing informality in developing countries, financial crises arising out of the housing sector, and market-oriented and public policy solutions. The course features a wide array of speakers in finance, government and academia who contribute their perspectives to pressing issues of mortgage market design."},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-7540","sid":"FNCE-7540-001","cu":1,"title":"ESG and Impact Investing","days":"M, W","st":825,"et":914,"cq":2.27,"iq":2.67,"diff":2.02,"work":2.12,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Christopher C. Geczy","cq":2.265909091,"iq":2.674090909,"d":2.023181818,"w":2.124545455}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE7540001","desc":"This course explores Impact Investing, a discipline that seeks to generate social benefits as well as financial returns. From tiny beginnings, the Impact Investment space has expanded and now commands significant attention from policymakers, wealthy and public-spirited individuals, academia and, not least, the world's largest asset managers and philanthropic foundations. Evangelists believe it may be the key to freeing the world from poverty. Skeptics think it will remain confined to the boutique. Regardless, Impact Investing is becoming a distinct career specialization for finance professionals despite the diverse skillset each must have and the uncertainty of the new field's growth. In addition to prerequisites, FNCE 7050 is recommended but not required.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. \nNote: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/)\nto request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. Prerequisites: FNCE 6110.\n"},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-7070","sid":"FNCE-7070-001","cu":1,"title":"Valuation","days":"M, W","st":825,"et":914,"cq":2.27,"iq":2.45,"diff":3.28,"work":3.47,"onList":"Yes","listCU":1,"listSec":2,"insts":[{"n":"Amy Wang. Huber","cq":2.265,"iq":2.45,"d":3.2775,"w":3.4725}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE7070002","desc":"The focus of this course is on the valuation of companies. The course covers current conceptual and theoretical valuation frameworks and translates those frameworks into practical approaches for valuing companies. The relevant accounting topics and the appropriate finance theory are integrated to show how to implement the valuation frameworks discussed on a step-by-step basis. The course teaches how to develop the required information for valuing companies from financial statements and other information sources in a real-world setting. Topics covered in depth include discounted cash flow techniques and price multiples. In addition, the course covers other valuation techniques such as leveraged buyout analysis.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. Course must be taken for a grade. Note: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/)\nto request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. Attendance at first class is *mandatory.* Prerequisites: FNCE 6110 and (ACCT 6110 or ACCT 6130) and (STAT 6130 or STAT 6210).\n\n\n\n"},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-7070","sid":"FNCE-7070-002","cu":1,"title":"Valuation","days":"M, W","st":930,"et":1019,"cq":2.27,"iq":2.45,"diff":3.28,"work":3.47,"onList":"Yes","listCU":1,"listSec":2,"insts":[{"n":"Amy Wang. Huber","cq":2.265,"iq":2.45,"d":3.2775,"w":3.4725}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE7070002","desc":"The focus of this course is on the valuation of companies. The course covers current conceptual and theoretical valuation frameworks and translates those frameworks into practical approaches for valuing companies. The relevant accounting topics and the appropriate finance theory are integrated to show how to implement the valuation frameworks discussed on a step-by-step basis. The course teaches how to develop the required information for valuing companies from financial statements and other information sources in a real-world setting. Topics covered in depth include discounted cash flow techniques and price multiples. In addition, the course covers other valuation techniques such ","days":"M, W","st":930,"et":1019,"cq":2.25,"iq":2.64,"diff":2.82,"work":2.48,"onList":"Yes","listCU":1,"listSec":6,"insts":[{"n":"Itamar Drechsler","cq":"N/A","iq":"New","d":"N/A","w":"N/A"},{"n":"Sasha Scarlett. Indarte","cq":2.249166667,"iq":2.635833333,"d":2.815,"w":2.478333333}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE6110004","desc":"This course serves as an introduction to business finance (corporate financial management and investments) for both non-majors and majors preparing for upper-level course work. The primary objective is to provide the framework, concepts, and tools for analyzing financial decisions based on fundamental principles of modern financial theory. The approach is rigorous and analytical. Topics covered include discounted cash flow techniques; corporate capital budgeting and valuation; investment decisions under uncertainty; capital asset pricing; options; and market efficiency. The course will also analyze corporate financial policy, including capital structure, cost of capital, dividend policy, and related issues. Additional topics will differ according to individual instructors.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. Course must be taken for a grade. Note: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/)\nto request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. \n\n\n\n"},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-7480","sid":"MGMT-7480-001","cu":0.5,"title":"How To Be the Boss","days":"M, W","st":825,"et":914,"cq":2.2,"iq":2.45,"diff":1.63,"work":2.02,"onList":"Yes","listCU":0.5,"listSec":1,"insts":[{"n":"Peter Cappelli","cq":2.204,"iq":2.452,"d":1.626,"w":2.016}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT7480001","desc":"Despite the press accounts about the \"gig\" economy, the Bureau of Labor Statistics calculates that about 92 percent of the people working in the US are employees who are supervised by someone. That figure has remained roughly the same for decades. The term \"supervisor\" is sometimes used for the first-level of supervision in an organization, but in fact that role - and indeed the title - goes all the way up to the very top of any employer organization. Even CEO's are the supervisor of their direct reports. When people talk about their \"boss,\" they are almost always referring to the person who supervises them. Supervisors are the central actors in accomplishing work tasks, especially in projects where they also have autonomy over what is done and how it is done. They have an extraordinary amount of power and influence over their direct reports and considerable responsibility toward them. There is considerable truth to the aphorism that people quit bosses, not organizations, as employee dissatisfaction with supervisors rates as one of the leading causes of turnover. There is little doubt that a bad boss can make the life of a subordinate miserable, while a good boss can do the opposite, i.e. improving job design to make work more motivating, providing support during difficult periods of learning new tasks and facing performance pressures, helping chart a career path, and mentoring in organizational realities. Being a supervisor is not the same as leading a team of peers. Supervisors have formal authority over subordinates that we never have with peers. Supervisors also have decisions they cannot delegate, and are personally accountable for them. Stepping into a supervisor position is challenging, especially so when it comes with a promotion in the same organization having to manage direct reports who were peers. In this class, we examine the role of the supervisor and the unique tasks associated with performing that role.\nWharton MBA course. Course must be taken for a grade. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-7390","sid":"FNCE-7390-001","cu":1,"title":"Behavioral Finance","days":"M, W","st":930,"et":1019,"cq":2.17,"iq":2.53,"diff":2.12,"work":2.16,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Marius Guenzel","cq":2.165,"iq":2.53,"d":2.12,"w":2.155}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE7390001","desc":"There is an abundance of evidence suggesting that the standard economic paradigm - rational agents in an efficient market - does not adequately describe behavior in financial markets. In this course, we will survey the evidence and use psychology to guide alternative theories of financial markets. Along the way, we will address the standard argument that smart, profit-seeing agents can correct any distortions caused by irrational investors. Further, we will examine more closely the preferences and trading decisions of individual investors. We will argue that their systematic biases can aggregate into observed market inefficiencies, thus giving rise to apparently profitable trading strategies. The latter part of the course extends the analysis to corporate decision making. We then explore the evidence for both views in the context of capital structure, investment, dividend, and merger decisions. In addition to prerequisites, FNCE 7050 is highly recommended but not required.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. \nNote: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/)\nto request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. Prerequisites: FNCE 6110.\n"},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-8120","sid":"MGMT-8120-001","cu":0.5,"title":"Social Entrepreneurship","days":"M","st":930,"et":1109,"cq":2.15,"iq":2.56,"diff":1.7,"work":2.23,"onList":"Yes","listCU":0.5,"listSec":1,"insts":[{"n":"James D. Thompson","cq":2.15,"iq":2.56,"d":1.7,"w":2.23}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT8120001","desc":"This is a course on creating a business to attack a social problem and thereby accomplish both social impact and financial sustainability. For this course, social entrepreneurship is defined as entrepreneurship used to profitably confront social problems. This definition therefore views social entrepreneurship as a distinct alternative to public sector initiatives. The basic thesis is that many social problems, if looked at through an entrepreneurial lens, create opportunity for someone to launch a venture that generates profits by alleviating that social problem. This sets in motion a virtuous cycle - the entrepreneur is incented to generate more profits and in so doing, the more the profits made, the more the problem is alleviated. Even if it is not possible to eventually create a profit-making enterprise, the process of striving to do so can lead to a resource-lean not-for-profit entity. Creating a profitable social entrepreneurship venture is by no means a simple challenge. Cross-listed with MGMT 212.\n*Attendance at first day is mandatory. Failure to attend first class will result in drop from the course.* MBA students must request enrollment for this class through Course Match and should not use the “Add to Cart” or “Request Permission” functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"BEPP-8360","sid":"BEPP-8360-401","cu":1,"title":"Int'l Housing Comparisns","days":"M, W","st":720,"et":809,"cq":2.13,"iq":2.42,"diff":2.17,"work":1.83,"pricedAs":"REAL-8360-401","onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Susan M. Wachter","cq":2.13,"iq":2.42,"d":2.17,"w":1.83}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=BEPP8360401","desc":"This course analyzes housing finance systems and housing market outcomes across the globe. In the US, the course focuses on the development of securitization markets and addresses the current challenges of housing finance reform, including the future of Fannie Mae and Freddie Mac. Internationally, the course covers issues of access to housing and housing informality in developing countries, financial crises arising out of the housing sector, and market-oriented and public policy solutions. The course features a wide array of speakers in finance, government and academia who contribute their perspectives to pressing issues of mortgage market design."},{"src":"2026A list (proxy)","sem":"2026A","cid":"BEPP-9500","sid":"BEPP-9500-403","cu":1,"title":"Managerial Economics","days":"T, R","st":615,"et":704,"cq":2.09,"iq":2.39,"diff":3.07,"work":2.56,"onList":"No","insts":[{"n":"Ulrich Doraszelski","cq":2.090555556,"iq":2.385,"d":3.074444444,"w":2.555},{"n":"Mariaflavia Harari","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=BEPP9500406","desc":"Public goods, externalities, uncertainty, and income redistribution as sources of market failures; private market and collective choice models as possible correcting mechanisms. Microeconomic theories of taxation and public sector expenditures. The administration and organization of the public sector."},{"src":"2026A list (proxy)","sem":"2026A","cid":"BEPP-9500","sid":"BEPP-9500-404","cu":1,"title":"Managerial Economics","days":"T, R","st":510,"et":599,"cq":2.09,"iq":2.39,"diff":3.07,"work":2.56,"onList":"No","insts":[{"n":"Ulrich Doraszelski","cq":2.090555556,"iq":2.385,"d":3.074444444,"w":2.555},{"n":"Mariaflavia Harari","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=
