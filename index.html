<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CourseMatch Optimizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header + summary ledger, then a working surface per tab (Plan, Simulate, Catalog, Settings); side drawer for course detail.
   Palette: white base, Penn Blue for structure and actions, Penn Red as the accent rule and for warnings. Deliberately light-only. */
:root{
  --paper:#FFFFFF; --surface:#FFFFFF; --sunk:#F5F7FB; --ink:#0A1630; --muted:#56627A; --faint:#8C97AB; --line:#DDE3EC; --line2:#EBEFF5;
  --navy:#011F5B; --navy-ink:#FFFFFF; --red:#990000; --link:#01307F; --sel:#DCE5F4; --tgt-bg:#F1F5FC;
  --ok:#1B7A4A; --ok-bg:#E5F4EC; --warn:#8A5A00; --warn-bg:#FBF1DE; --bad:#990000; --bad-bg:#FBEAEA; --info-bg:#E8EEF9;
  --spring:#011F5B; --fall:#9AACCB;
  --f-ui:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
h1,h2,h3{font-stretch:78%;text-wrap:balance;margin:0;line-height:1.1}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--navy)}
header.top::before{content:"";position:absolute;left:0;top:-4px;height:4px;width:22%;background:var(--red)}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:22px;font-weight:800;font-stretch:72%;letter-spacing:.01em;color:var(--navy)}
.brand .term{font-family:var(--f-num);font-size:12px;padding:2px 7px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
nav.tabs a{padding:8px 12px;border-radius:var(--r);text-decoration:none;color:var(--muted);font-weight:600;font-stretch:90%;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--navy);color:var(--navy-ink);box-shadow:inset 0 -3px 0 var(--red)}
nav.tabs a:hover:not([aria-current]){background:var(--sunk);color:var(--ink)}
.status{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--faint);margin-right:5px;vertical-align:middle}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}

/* ledger */
.ledger{display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr 1.4fr;gap:1px;background:var(--line2);border-top:1px solid var(--line2)}
.ledger>div{background:var(--surface);padding:10px 14px;min-width:0}
.ledger .big{font-family:var(--f-num);font-size:22px;font-weight:500;line-height:1.15;color:var(--navy)}
.ledger .sub{font-size:12px;color:var(--muted)}
.meter{position:relative;height:10px;background:var(--sunk);border:1px solid var(--line);border-radius:3px;margin:6px 0 4px}
.meter .range{position:absolute;top:0;bottom:0;background:var(--sel)}
.meter .est{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--navy);border-radius:1px}
.meter .bud{position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px dashed var(--red)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--link)}.pill.mute{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}

main{padding-block:16px 48px}
section.view[hidden]{display:none}
.toolbar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:3px}
.field input,.field select{height:34px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 9px}
.field input[type=number]{width:96px;font-family:var(--f-num)}
.btn{height:34px;padding:0 13px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-stretch:92%;white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.small{height:28px;padding:0 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--link)}
.btn:disabled{opacity:.5;cursor:default}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 2px rgba(1,31,91,.05)}
.note{font-size:12.5px;color:var(--muted);max-width:75ch}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:8px;background:var(--info-bg);margin-bottom:12px;font-size:13px}
.banner.warn{background:var(--warn-bg)}

/* plan table */
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line2)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);font-weight:600;background:var(--sunk);position:sticky;top:0;white-space:nowrap}
td.r,th.r{text-align:right}
tr.tgt td{background:var(--tgt-bg)}
tr.tgt td:first-child{box-shadow:inset 3px 0 0 var(--navy)}
tr.sep td{background:var(--sunk);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:5px 9px}
tfoot td{font-weight:600;background:var(--sunk);border-bottom:0}
.sid{font-family:var(--f-num);font-weight:600;font-size:13px;white-space:nowrap}
.sid button{all:unset;cursor:pointer;color:var(--link)}
.sid button:hover{text-decoration:underline}
.ttl{font-size:12.5px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11.5px;color:var(--muted);white-space:nowrap}
.uin{width:58px;height:30px;border:1px solid var(--line);border-radius:5px;background:var(--surface);text-align:right;padding:0 6px;font-family:var(--f-num);font-weight:600}
.chk{width:18px;height:18px;accent-color:var(--navy);cursor:pointer}
select.q{height:28px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:12px;padding:0 4px}
.margin{display:flex;align-items:center;gap:6px;justify-content:flex-end;white-space:nowrap}
.mbar{width:64px;height:8px;background:var(--sunk);border-radius:2px;position:relative;overflow:hidden;border:1px solid var(--line2)}
.mbar i{position:absolute;top:0;bottom:0}
.mbar i.pos{left:50%;background:var(--ok)}.mbar i.neg{right:50%;background:var(--bad)}.mbar i.big{left:50%;background:var(--warn)}
.mbar::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid var(--muted)}
.flags{display:flex;flex-wrap:wrap;gap:3px;max-width:340px}
.rate{font-family:var(--f-num);font-size:12px;white-space:nowrap}
.rate b{font-weight:600}
.x{all:unset;cursor:pointer;color:var(--faint);padding:2px 6px;border-radius:4px}
.x:hover{color:var(--bad);background:var(--bad-bg)}
.addbar{display:flex;gap:8px;align-items:center;padding:10px;border-top:1px solid var(--line2);flex-wrap:wrap}
.addbar input{height:32px;border:1px solid var(--line);border-radius:var(--r);padding:0 9px;background:var(--surface);min-width:0;flex:1;max-width:340px;font-family:var(--f-num)}

/* fit panel */
.fit{padding:14px;margin-bottom:12px;display:grid;gap:10px}
.fit table td,.fit table th{padding:5px 8px}
.diffup{color:var(--ok)}.diffdn{color:var(--bad)}

/* simulate */
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.cardpad{padding:14px}
.matrix td.c{text-align:center}
.tick{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;background:var(--navy);color:var(--navy-ink);font-weight:800;font-size:12px}
.prob{display:flex;align-items:center;gap:8px}
.prob .bar{flex:1;height:10px;background:var(--sunk);border-radius:2px;overflow:hidden;border:1px solid var(--line2);min-width:60px}
.prob .bar i{display:block;height:100%;background:var(--navy)}
.sched{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2)}
.chip{font-family:var(--f-num);font-size:11.5px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;background:var(--sunk)}

/* catalog */
.cfilters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.cfilters input[type=search]{width:280px;max-width:100%}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.spark{display:block}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:4px solid var(--navy);z-index:40;overflow-y:auto;box-shadow:-18px 0 40px rgba(10,20,40,.18);padding:calc(16px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px}
.scrim{position:fixed;inset:0;background:rgba(8,14,24,.35);z-index:39}
.drawer h2{font-size:26px;font-weight:800;color:var(--navy)}
.cardpad h2,.fit h3{color:var(--navy)}
.drawer .sec{margin-top:18px;display:grid;gap:8px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kv div{background:var(--sunk);border:1px solid var(--line2);border-radius:6px;padding:7px 9px}
.kv b{display:block;font-family:var(--f-num);font-size:18px;font-weight:500}
.desc{font-size:13px;color:var(--ink);max-height:180px;overflow:auto;white-space:pre-wrap;background:var(--sunk);padding:10px;border-radius:6px;border:1px solid var(--line2)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:8px;font-family:var(--f-num);font-size:12px}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:10px}
.chart .axis{stroke:var(--line)}

/* settings */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.prose{font-size:13.5px;max-width:68ch}
.prose p{margin:0 0 8px}
.prose h3{font-size:17px;margin:14px 0 6px;font-weight:700}
input[type=range]{accent-color:var(--navy);width:180px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:13px;z-index:60}

@media (max-width:1100px){.ledger{grid-template-columns:repeat(3,minmax(0,1fr))}.ledger>div:first-child{grid-column:1/-1}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.ledger{grid-template-columns:repeat(2,minmax(0,1fr))}.ledger .big{font-size:18px}.hide-sm{display:none}.kv{grid-template-columns:repeat(2,minmax(0,1fr))}.brand h1{font-size:19px}.status{display:none}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap topbar">
    <div class="brand"><h1>CourseMatch Optimizer</h1><span class="term" id="termChip">Spring 2027</span></div>
    <div class="status"><span id="saveState"><span class="dot"></span>Loading…</span><span id="pcrState"></span></div>
    <nav class="tabs" aria-label="Views">
      <a href="#plan" data-tab="plan">Plan</a>
      <a href="#simulate" data-tab="simulate">Simulate</a>
      <a href="#catalog" data-tab="catalog">Catalog</a>
      <a href="#setup" data-tab="setup">Settings</a>
    </nav>
  </div>
  <div class="ledger" id="ledger"></div>
</header>

<main class="wrap">
  <section class="view" id="v-plan">
    <div id="planBanner"></div>
    <div class="toolbar">
      <label class="field"><span class="label">Budget (tokens)</span><input id="inBudget" type="number" min="0" step="50"></label>
      <label class="field"><span class="label">Max CUs</span><input id="inMaxCU" type="number" min="0" step="0.5"></label>
      <label class="field"><span class="label">Size utilities to clear</span>
        <select id="inBench">
          <option value="avg">Average price</option><option value="median">Median price</option><option value="est">Est. price (weighted)</option>
          <option value="last">Last Spring price</option><option value="low">Low</option><option value="high">High</option>
        </select></label>
      <div class="spacer"></div>
      <button class="btn" id="btnSync" title="Pull Spring 2027 sections and ratings for your shortlist">Refresh from Penn Course Review</button>
      <button class="btn primary" id="btnFit">Fit utilities</button>
    </div>
    <div id="fitPanel" hidden></div>
    <div class="tablebox"><table id="planTable"></table>
      <div class="addbar">
        <input id="addInput" list="sidList" placeholder="Add a section, e.g. FNCE-7070-001" aria-label="Section ID to add" autocomplete="off">
        <button class="btn small" id="btnAdd">Add to shortlist</button>
        <span class="note" id="addMsg"></span>
        <div class="spacer"></div>
        <button class="btn small ghost" id="btnExport">Export utilities (.csv)</button>
        <button class="btn small ghost" id="btnCopy">Copy utilities</button>
      </div>
    </div>
    <datalist id="sidList"></datalist>
    <p class="note" id="planNote"></p>
  </section>

  <section class="view" id="v-simulate" hidden></section>
  <section class="view" id="v-catalog" hidden></section>
  <section class="view" id="v-setup" hidden></section>
</main>
<div id="drawerHost"></div>
<div id="toastHost"></div>

<script>
const DATA = {"cat":[{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-7900","sid":"MGMT-7900-001","cu":1,"title":"WORKS Immer - Prison Education","days":"T","st":930,"et":1109,"cq":3.92,"iq":3.5,"diff":1.44,"work":2.89,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Damon Phillips","cq":3.92,"iq":3.5,"d":1.44,"w":2.89}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT7900001","desc":"This is an experiential learning course in partnership with Resilience Education, where the core organizing activity is teaching business topics inside prisons. While this is a professor-led course, it is also a co-created experience where your role is essential. Your work this term will be hugely impactful for your incarcerated learners and their families, as well as foundational for future Wharton MBAs. For these reasons, I thank you in advance for your co-leadership. I hope you take the opportunity to lend your talents to important initiatives. We are bolstered by the fact that research has consistently shown that there are positive returns to education for incarcerated people. At the same time, formal education in prison is usually limited to liberal arts topics. As a result, returning citizens have a need to understand personal finance and how businesses operate in a way that compliments other forms of education that they may be exposed to. There is a particular interest among incarcerated people to learn about entrepreneurship, either because they have promising business ideas or because they see entrepreneurship as a viable alternative given persistent labor market discrimination. This course provides a means for you to pass along these important skills and tools.\nPrerequisite: MGMT 7860 must be taken prior to enrollment. Wharton MBA Course. Course must be taken for a grade. MBA students must request enrollment for this class through Course Match and should not use the “Add to Cart” or “Request Permission” functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-6710","sid":"MGMT-6710-001","cu":0.5,"title":"Executive Leadership","days":"M, W","st":615,"et":704,"cq":3.66,"iq":3.89,"diff":1.52,"work":1.95,"onList":"No","insts":[{"n":"Michael Parke","cq":3.66,"iq":3.89,"d":1.52,"w":1.95}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT6710001","desc":"Despite the business world’s obsession with leadership, what it takes to be an effective leader is often not commonly understood nor commonly practiced. In this course, the focus is on growing the student's capacity as a leader. Students will learn practical and customized lessons about how to improve their performance and results at work. We use the evidence from the science of leadership and teams to understand the key tactics and principles that will enable students to better lead others as they strive to attain shared goals. We will cover topics such as leadership effectiveness, adaptive leadership, empowering leadership as well as how to motivate, inspire, and lead teams effectively (e.g., decision making, coordination, coaching). This course offers students the opportunity to learn and practice the skills needed to become better leaders, now and in the future.\nWharton MBA course. Course must be taken for a grade. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"STAT-7760","sid":"STAT-7760-401","cu":1,"title":"Appl Prob Models Mktg","days":"M","st":930,"et":1109,"cq":3.63,"iq":3.77,"diff":3.77,"work":3.62,"pricedAs":"MKTG-7760-401","onList":"Yes","listCU":1,"listSec":3,"insts":[{"n":"Peter S. Fader","cq":3.631176471,"iq":3.772352941,"d":3.768823529,"w":3.619411765}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=STAT7760443","desc":"This course will expose students to the theoretical and empirical \"building blocks\" that will allow them to construct, estimate, and interpret powerful models of consumer behavior. Over the years, researchers and practitioners have used these models for a wide variety of applications, such as new product sales, forecasting, analyses of media usage, and targeted marketing programs. Other disciplines have seen equally broad utilization of these techniques. The course will be entirely lecture-based with a strong emphasis on real-time problem solving. Most sessions will feature sophisticated numerical investigations using Microsoft Excel. Much of the material is highly technical."},{"src":"2026A list (proxy)","sem":"2026A","cid":"STAT-7760","sid":"STAT-7760-402","cu":1,"title":"Appl Prob Models Mktg","days":"T","st":930,"et":1109,"cq":3.63,"iq":3.77,"diff":3.77,"work":3.62,"pricedAs":"MKTG-7760-402","onList":"Yes","listCU":1,"listSec":3,"insts":[{"n":"Peter S. Fader","cq":3.631176471,"iq":3.772352941,"d":3.768823529,"w":3.619411765}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=STAT7760443","desc":"This course will expose students to the theoretical and empirical \"building blocks\" that will allow them to construct, estimate, and interpret powerful models of consumer behavior. Over the years, researchers and practitioners have used these models for a wide variety of applications, such as new product sales, forecasting, analyses of media usage, and targeted marketing programs. Other disciplines have seen equally broad utilization of these techniques. The course will be entirely lecture-based with a strong emphasis on real-time problem solving. Most sessions will feature sophisticated numerical investigations using Microsoft Excel. Much of the material is highly technical."},{"src":"2026A list (proxy)","sem":"2026A","cid":"STAT-7760","sid":"STAT-7760-403","cu":1,"title":"Appl Prob Models Mktg","days":"W","st":930,"et":1109,"cq":3.63,"iq":3.77,"diff":3.77,"work":3.62,"pricedAs":"MKTG-7760-403","onList":"Yes","listCU":1,"listSec":3,"insts":[{"n":"Peter S. Fader","cq":3.631176471,"iq":3.772352941,"d":3.768823529,"w":3.619411765}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=STAT7760443","desc":"This course will expose students to the theoretical and empirical \"building blocks\" that will allow them to construct, estimate, and interpret powerful models of consumer behavior. Over the years, researchers and practitioners have used these models for a wide variety of applications, such as new product sales, forecasting, analyses of media usage, and targeted marketing programs. Other disciplines have seen equally broad utilization of these techniques. The course will be entirely lecture-based with a strong emphasis on real-time problem solving. Most sessions will feature sophisticated numerical investigations using Microsoft Excel. Much of the material is highly technical."},{"src":"2026A list (proxy)","sem":"2026A","cid":"REAL-8210","sid":"REAL-8210-401","cu":1,"title":"Real Estate Development","days":"W","st":930,"et":1109,"cq":3.63,"iq":3.8,"diff":3.81,"work":3.92,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Asuka Nakahara","cq":3.626666667,"iq":3.803333333,"d":3.806666667,"w":3.916666667},{"n":"Tony Dona","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=REAL8210401","desc":"This course evaluates \"ground-up\" development as well as re-hab, re-development, and acquisition investments. We examine raw and developed land and the similarities and differences of traditional real estate product types including office, R & D, retail, warehouses, single family and multi-family residential, mixed use, and land as well as \"specialty\" uses like golf courses, assisted living, and fractional share ownership. Emphasis is on concise analysis and decision making. We discuss the development process with topics including market analysis, site acquisition, due diligence, zoning, entitlements, approvals, site planning, building design, construction, financing, leasing, ofit entrepreneurship. We will be concerned with content and process questions as well as with formulation and implementation issues that relate to conceptualizing, developing, and managing successful new ventures. The emphasis in this course is on applying and synthesizing concepts and techniques from functional areas of strategic management, finance, accounting, managerial economics, marketing, operations management, and organizational behavior in the context of new venture development. The class serves as both a stand alone class and as a preparatory course to those interested in writing and venture implementation (the subject of the semester-long course, MGMT 806). Format: Lectures and case discussions"},{"src":"2026A list (proxy)","sem":"2026A","cid":"OIDD-6360","sid":"OIDD-6360-001","cu":1,"title":"Scaling Operations","days":"T","st":930,"et":1109,"cq":3.56,"iq":3.74,"diff":2.74,"work":2.85,"onList":"Yes","listCU":1,"listSec":2,"insts":[{"n":"Gad Allon","cq":3.562580645,"iq":3.740967742,"d":2.738709677,"w":2.846774194}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=OIDD6360002","desc":"The goal of this course is to make strategic scaling decisions that are grounded in operational reality. We study how to build and evaluate the operational business model of the firm to maximize value with the focus on scaling the firm's operations. We will approach the challenge of scaling by taking a holistic view that incorporates competitive strategy, financial evaluation, and the customer experience. We focus on decisions and challenges that many firms that try to scale their operations face with the focus on assessing the readiness of the firm to scale, and the required steps to scale. In particular, we will discuss whether the firm should build competencies in-house (i.e., investing in a portfolio of assets) or buy them (i.e., developing and implementing a global sourcing strategy and integrating external partners) and the risks associated with scaling these. We will also discuss the organizational implications of scaling. There are no formal pre-requisites to the class. Students who have already taken OIDD 611, OIDD 615, and STAT 613 should be equipped for the class. Other students should have a solid understanding of elementary probability and statistics. For questions regarding the specifics of your background, please contact the instructor.\nWharton MBA course. Course must be taken for a grade. MBA students must request enrollment for this class via the application portal and should not use the \"Add to Cart\" or \"Request Permission\" functions. *First Class Attendance Mandatory*"},{"src":"2026A list (proxy)","sem":"2026A","cid":"OIDD-6360","sid":"OIDD-6360-002","cu":1,"title":"Scaling Operations","days":"W","st":930,"et":1109,"cq":3.56,"iq":3.74,"diff":2.74,"work":2.85,"onList":"Yes","listCU":1,"listSec":2,"insts":[{"n":"Gad Allon","cq":3.562580645,"iq":3.740967742,"d":2.738709677,"w":2.846774194}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=OIDD6360002","desc":"The goal of this course is to make strategic scaling decisions that are grounded in operational reality. We study how to build and evaluate the operational business model of the firm to maximize value with the focus on scaling the firm's operations. We will approach the challenge of scaling by taking a holistic view that incorporates competitive strategy, financial evaluation, and the customer experience. We focus on decisions and challenges that many firms that try to scale their operations face with the focus on assessing the readiness of the firm to scale, and the required steps to scale. In particular, we will discuss whether the firm should build competencies in-house (i.e., investing in a portfolio of assets) or buy them (i.e., developing and implementing a global sourcing strategy and integrating external partners) and the risks associated with scaling these. We will also discuss the organizational implications of scalin y; diversity and affirmative action; and the legal and regulatory environment regarding immigration, wage and hour, leaves of absence, hiring, termination and afterwards; and labor/management relations and collective bargaining.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"OIDD-6910","sid":"OIDD-6910-406","cu":1,"title":"Negotiations","days":"T","st":930,"et":1109,"cq":3.37,"iq":3.39,"diff":1.99,"work":2.23,"onList":"Yes","listCU":1,"listSec":9,"insts":[{"n":"Nazli M. Bhatia","cq":3.368461538,"iq":3.387692308,"d":1.993076923,"w":2.234615385}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=OIDD6910414","desc":"This course examines the art and science of negotiation, with additional emphasis on conflict resolution. Students will engage in a number of simulated negotiations ranging from simple one-issue transactions to multi-party joint ventures. Through these exercises and associated readings, students explore the basic theoretical models of bargaining and have an opportunity to test and improve their negotiation skills. Cross-listed with MGMT 6910/OIDD 6910/LGST 8060. Format: Lecture, class discussion, simulation/role play, and video demonstrations. Materials: Textbook and course pack."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-6910","sid":"MGMT-6910-406","cu":1,"title":"Negotiations","days":"T","st":930,"et":1109,"cq":3.37,"iq":3.39,"diff":1.99,"work":2.23,"onList":"Yes","listCU":1,"listSec":9,"insts":[{"n":"Nazli M. Bhatia","cq":3.368461538,"iq":3.387692308,"d":1.993076923,"w":2.234615385}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT6910414","desc":"This course examines the art and science of negotiation, with additional emphasis on conflict resolution. Students will engage in a number of simulated negotiations ranging from simple one llabi/?term=202610&course=BEPP7890001","desc":"This course is intended to deepen understanding of the major contemporary issues in the world economy. The focus is on the \"big picture\" of global economic developments and the evolution of economic thought over the last one hundred years. The topics include: financial market booms and busts; business cycles; monetary and fiscal policies; inequality; the social welfare state; technological change and economic growth; and international trade and financial arrangements. The time period covers: the Roaring Twenties; the Great Depression, the post war Golden Age (1945-1973); the stagflation of the 1970s; the Washington Consensus era of the market liberalization (1980-2007); and the 2008 financial crisis and ensuing Great Recession; and the recent rise of populism. This course also explores different schools of thought. The course will chronicle and compare economic policy and performance of the United States, Europe, Japan and emerging markets (Asia, Latin America, Africa).\nThis class is open to non-Wharton students on a space-available basis. Non-Wharton students must place a permission request in the PATH system in order to be eligible to receive a permission to enroll. Wharton MBA Course. Non-Wharton students will not be approved/enrolled until after the Wharton MBA coursematch concludes. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MKTG-7540","sid":"MKTG-7540-004","cu":0.5,"title":"Pricing Policy","days":"M, W","st":930,"et":1019,"cq":3.34,"iq":3.51,"diff":2.87,"work":3.22,"onList":"Yes","listCU":0.5,"listSec":3,"insts":[{"n":"Jagmohan Singh. Raju","cq":3.338484848,"iq":3.507575758,"d":2.873939394,"w":3.219393939}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MKTG7540402","desc":"The course provides a systematic presentation of the factors to b ional emphasis on conflict resolution. Students will engage in a number of simulated negotiations ranging from simple one-issue transactions to multi-party joint ventures. Through these exercises and associated readings, students explore the basic theoretical models of bargaining and have an opportunity to test and improve their negotiation skills. Cross-listed with MGMT 6910/OIDD 6910/LGST 8060. Format: Lecture, class discussion, simulation/role play, and video demonstrations. Materials: Textbook and course pack."},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-7910","sid":"FNCE-7910-701","title":"Corporate Restructuring","cq":3.29,"iq":3.5,"diff":2.93,"work":2.77,"onList":"No","insts":[{"n":"Kevin M. Kaiser","cq":3.29125,"iq":3.4975,"d":2.93375,"w":2.7725}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE7910701","desc":"This course explores the highly active and sophisticated deal making environment that is the hallmark of modern corporate restructuring. The course is primarily comprised of two key components. The first is groundwork-laying lectures that focus on fundamental rights and obligations of debtors, creditors, and other parties in interest in the various types of major chapter 11 cases, providing critical insight into understanding the motivations, strategies, and available tools for chapter 11 participants (which also serve as the foundation for out-of-court deals). The second element of the course is a series of case study panels based on market trends from the previous year that bring together key participants from recent deals, including the CEO or chairman of the company, the judge, the lead banker and lead lawyer, and the lead investors to give their insight and perspectives to the class."},{"src":"2026A list (proxy)","sem":"2026A","cid":"ACCT-7470","sid":"ACCT-7470-001","cu":1,"title":"Fin Disclosure Analytics","days":"T, R","st":510,"et":599,"cq":3.28,"iq":3.7,"diff":1.83,"work":1.83,"onList":"Yes","listCU":1,"listSec":2,"insts":[{"n":"Brian J. Bushee","cq":3.283103448,"iq":3.702413793,"d":1.829655172,"w":1.832758621}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=ACCT7470002","desc":"This course focuses on the analysis of financial communications between corporate managers and outsiders, including the required financial statements, voluntary disclosures, and interactions with investors, analysts, and the media. The course draws on the findings of recent academic research to discuss a number of techniques that outsiders can use to detect potential bias or aggressiveness in financial reporting. FORMAT: Case discussions and lectures. Comprehensive final exam, group project, case write-ups, and class participation.\nAuditors need permission. Wharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"ACCT-7470","sid":"ACCT-7470-002","cu":1,"title":"Fin Disclosure Analytics","days":"T, R","st":615,"et":704,"cq":3.28,"iq":3.7,"diff":1.83,"work":1.83,"onList":"Yes","listCU":1,"listSec":2,"insts":[{"n":"Brian J. Bushee","cq":3.283103448,"iq":3.702413793,"d":1.829655172,"w":1.832758621}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=ACCT7470002","desc":"This course focuses on the analysis of financial communications between corporate managers and outsiders, including the required financial statements, voluntary disclosures, and interactions with investors, analysts, and the media. The course draws on the findings of recent academic research to discuss a number of techniques that outsiders can use to detect potential bias or aggressiveness in financial reporting. FORMAT: Case discussions and lectures. Comprehensive final exam, group project, case write-ups, and class participation.\nAuditors need permission. Wharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MKTG-7780","sid":"MKTG-7780-001","cu":1,"title":"Strategic Brand Mgmt","days":"T, R","st":825,"et":914,"cq":3.25,"iq":3.55,"diff":1.92,"work":2.3,"onList":"No","insts":[{"n":"Patricia A. Williams","cq":3.251764706,"iq":3.545294118,"d":1.919411765,"w":2.297058824}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MKTG7780001","desc":"Which brands make you happy? Apple? Amazon? Starbucks? Everlane? Soulcycle? Sweetgreen? What draws you into these brands? How do companies create compelling brand experiences? How could you cultivate a well-loved brand? This course explores such questions with the goal of identifying the ingredients for building an inspired brand. The course is created for students interested in building a brand and/or immersing themselves in the enhancement of an existing brand, and it is comprised of lectures, cases, guest speakers, discussions, in and out of class exercises, and a final project. Broadly, the course will be divided into four parts: 1) Understanding Brand, 2) Crafting Brand, 3) Measuring Brand, and 4) Managing Brand. The course will provide students with an appreciation of the role of branding and (taking a consumer-centric approach) will augment students' ability to think creatively and critically about the strategies and tactics involved in building, leveraging, defending, and sustaining inspired brands.\nFirst Day of Class attendance is Mandatory. NOTICE TO MBA STUDENTS: MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. *************************************************************\nNOTICE TO NON-MBA STUDENTS: If there are any seats left after the MBA students register through Course Match, the instructor may choose to admit a few non-MBA students - only if they attended the first day of class. Only students who have entered a permission request in Path@Penn will be considered. (DO NOT EMAIL THE INSTRUCTOR). The availability of seats will not be known until early January. If there are seats available at that time the department will email you to see if you are still interested in taking the course. This course typically fills to capacity, and it is highly unlikely that any non-MBA students would be granted permission, so plan accordingly by signing up for a back-up course."},{"src":"2026A list (proxy)","sem":"2026A","cid":"LGST-6420","sid":"LGST-6420-001","cu":0.5,"title":"Big Data, Big Responsibilities","days":"T, R","st":615,"et":704,"cq":3.25,"iq":3.72,"diff":1.8,"work":2.12,"onList":"Yes","listCU":0.5,"listSec":2,"insts":[{"n":"Kevin Werbach","cq":3.25,"iq":3.72,"d":1.8,"w":2.12}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=LGST6420001","desc":"Artificial intelligence, and related forms of algorithmic decision-making and analytics, are already beginning to transform business, and beyond. With the immense power of these tools, however, comes tremendous responsibility. Problems of accuracy, liability, transparency, bias and discrimination, data protection, job displacement, manipulation, misinformation, and intellectual property violations are already prominent. Major government actors around the world are rapidly adopting new legislation and other obligations. This course identifies the major issues of AI accountability that organizations must consider, as well as the operational, legal compliance, ethical, and technical steps they can take to address them.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the “Add to Cart” or “Request Permission” functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"LGST-7290","sid":"LGST-7290-401","cu":0.5,"title":"Intel Property Strategy","days":"T, R","st":615,"et":704,"cq":3.25,"iq":3.44,"diff":2.13,"work":2.05,"pricedAs":"MGMT-7290-401","onList":"Yes","listCU":0.5,"listSec":1,"insts":[{"n":"Steven S. Weiner","cq":3.2475,"iq":3.4375,"d":2.1325,"w":2.045}],"syl":"https://coursesintouch.apps.upenn.edu/cpr/jsp/fast.do?webService=syll&t=202610&c=LGST7290401","desc":"Announcing the first iPhone at Macworld 2007, Apple CEO Steve Jobs famously boasted: \"And boy, have we patented it!\" How, and to what extent, do patents and intellectual property really provide competitive advantage for innovative technology companies? What makes an IP asset strategically powerful? How do patents impact, and even drive, major corporate decisions including M&A, venture funding and exits, and entry into new markets? In this course, students will learn to critically analyze and answer these questions, gaining insights they can leverage in their future roles as innovation industry executives, entrepreneurs, strategist and investors. The course includes three major units. In Unit 1, Patents and Innovation Value, we examine closely the relationship between competitive advantage, value proposition, and intellectual property (particularly patents). We will apply our understanding of that relationship to critique and sharpen patent strategy to protect examples of cutting-edge technologies. In Unit 2, Patent Leverage and the Corporate Playbook, we study theory and examples of how intellectual property leverage strategically informs corporate transactions and decisions, for established companies as well as for start-ups. In unit 3, Limits and Alternatives to Patents, we confront the recent legal trend toward reigning in the power and scope of patents. We also consider the growing importance of data as a proprietary technology asset, and discuss options for adapting intellectual property strategy appropriately. Throughout, students will learn and practice applying the concepts we learn to decision-making in examples based on innovative real-world technologies and businesses.\nWharton MBA course. Course must be side.wharton.upenn.edu/calendars/\n\nClass starts January 20, 2026"},{"src":"2026A list (proxy)","sem":"2026A","cid":"STAT-7220","sid":"STAT-7220-401","cu":0.5,"title":"Predictive Analytics","days":"M, W","st":825,"et":914,"cq":3.21,"iq":3.53,"diff":2.85,"work":2.58,"onList":"Yes","listCU":0.5,"listSec":1,"insts":[{"n":"Richard Paul. Waterman","cq":3.206666667,"iq":3.529333333,"d":2.854666667,"w":2.576}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=STAT7220401","desc":"This course follows from the introductory regression classes, STAT 1020, STAT 1120, and STAT 4310 for undergraduates and STAT 6130 for MBAs. It extends the ideas from regression modeling, focusing on the core business task of predictive analytics as applied to realistic business related data sets. In particular it introduces automated model selection tools, such as stepwise regression and various current model selection criteria such as AIC and BIC. It delves into classification methodologies such as logistic regression. It also introduces classification and regression trees (CART) and the popular predictive methodologies known as random forest and boosted trees. By the end of the course the student will be familiar with and have applied these concepts and will be ready to use them in a work setting. The methodologies are implemented in a variety of software packages. Applications in JMP emphasize concepts and key modeling decisions. This course is formerly STAT 6220.\nThis is an MBA Course. Auditors need permission. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions.\n\n*********************************************************************** \nNOTICE TO OTHER (NON-MBA) GRAD STUDENTS: After MBA Course Match runs, there may be seats available for non-MBA graduate students. You should submit a permission request for the course in Path@Penn. We'll start processing permission requests in January.\n"},{"src":"2026A list (proxy)","sem":"2026A","cid":"ACCT-7640","sid":"ACCT-7640-401","cu":1,"title":"Climate and Financial Markets","days":"M, W","st":615,"et":704,"cq":3.2,"iq":3.55,"diff":2.44,"work":2.5,"onList":"No","insts":[{"n":"Mirko Heinle","cq":3.2,"iq":3.483333333,"d":2.436666667,"w":2.503333333},{"n":"Arthur Van Benthem","cq":3.2,"iq":3.61,"d":2.436666667,"w":2.503333333}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=ACCT7640404","desc":"Climate change might be the defining challenge of our times, with a wide range of effects on financial markets and the broader economy. At the same time, financial markets play an important role in financing the transition to a net-zero economy, and incentivizing firms and investors to adapt their strategies. In this course, we examine how climate risks—both physical and regulatory—affect firms, financial markets (including equity, corporate debt, green bonds, municipal bonds, insurance, and carbon markets), and markets for energy, real estate and mortgages. We also examine the role that firms’ disclosures and third-party information sources play. Because financial markets are shaped by the information that is available to market participants, we investigate the impact of ESG reporting and rating agencies, including the costs and benefits of regulating ESG reporting and the impact of greenwashing. In the second part of the course, we study how governments and private investors finance investments in climate technologies. Here, we discuss various financial instruments that have been developed to address climate-change concerns. Given the enormous importance of electrification as a pathway towards a low-carbon future, there is special emphasis on renewable energy finance and economics. We also discuss the latest evidence of how climate risk has shaped decisions inside organizations, such as spin-offs, hedging, and the structure of executive-compensation contracts."},{"src":"2026A list (proxy)"," linical trial phase aimed at assessing the product’s safety and efficacy. In parallel, regulatory agencies guide and govern these trials and ultimately decide which products are approved for use in patients.\nOnce approved, launched, and priced, products face many dynamic market forces including competitors trying to steal share, government and private payers placing downward pressure on price, regulatory agencies controlling what manufacturers can and cannot say about their products, generic manufacturers challenging existing patents, and finally patients and physicians who behave both rationally and irrationally when deciding which product to use. While the course perspective is global in nature, the emphasis is on the U.S., the largest and most profitable market.\nIn addition, we will delve into the world of biotech start-ups from company creation and financing, to how they make decisions which compounds to advance. We will also explore how large pharma views the biotech industry to bolster their existing pipelines and drive shareholder value.\nThrough case studies, readings, guest speakers, and in-class exercises, students will learn concepts and analytical frameworks and acquire the tools and skills necessary to become the future leaders of the pharmaceutical and biotech industry.\nMBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. This course is strictly for MBA students. Non-MBA graduate students should contact Janice Singleton at @janices@wharton.upenn.edu for alternative option."},{"src":"2026A list (proxy)","sem":"2026A","cid":"OIDD-6630","sid":"OIDD-6630-002","cu":0.5,"title":"Databases For Analytics","days":"T","st":930,"et":1109,"cq":3.14,"iq":3.11,"diff":2.74,"work":2.53,"onList":"No","insts":[{"n":"Lorin Hitt","cq":3.14,"iq":3.11,"d":2.74,"w":2.53}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=OIDD6630002","desc":"Relational databases  chains, including: Which design and production activities to do in-house and which to outsource? Where to locate various activities around the world? How to forecast the many factors that influence these decisions, including inflation in cost factors such as labor and freight, and the likelihood of future government regulation or political instability? How to keep the supply chain flexible so as to adapt to change? How to manage a geographically disbursed supply chain, including what relationships to have with vendors to ensure low cost, high quality, flexibility, safety, humane labor practices and respect for sustainability of the environment? The course is highly interactive, using case discussions in most classes and senior supply chain executives in many sessions. Grades are based one-third each on class participation, individual write-ups of the discussion questions for 3 of the class sessions, and a course paper.\nMBA students must request enrollment for this class via the application portal and should not use the \"Add to Cart\" or \"Request Permission\" functions. *First Class Attendance Mandatory*"},{"src":"2026A list (proxy)","sem":"2026A","cid":"OIDD-6730","sid":"OIDD-6730-003","cu":0.5,"title":"Global Supply Chain Mgmt","days":"T, R","st":615,"et":704,"cq":3.02,"iq":3.15,"diff":1.71,"work":2.06,"onList":"Yes","listCU":0.5,"listSec":2,"insts":[{"n":"Juan Santiago. Gallino","cq":3.0175,"iq":3.1475,"d":1.71,"w":2.0625}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=OIDD6730003","desc":"Several forces, ranging from technology that has dramatically reduced the cost of communication, to political developments such as the opening up of China, Vietnam, and Eastern Europe, have created an avalanche of outsourcing and offshoring and lead to supply chains that stretch halfway around the world. This course will study the many questions that arise in the management of such global supply chains, including: Which design and production activities to :2.815,"w":2.43}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=BEPP9500406","desc":"Public goods, externalities, uncertainty, and income redistribution as sources of market failures; private market and collective choice models as possible correcting mechanisms. Microeconomic theories of taxation and public sector expenditures. The administration and organization of the public sector."},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-7250","sid":"FNCE-7250-001","cu":1,"title":"Fixed Income Securities","days":"M, W","st":510,"et":599,"cq":3,"iq":3.45,"diff":3.37,"work":2.9,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Stephan Dieckmann","cq":3.002142857,"iq":3.448571429,"d":3.373571429,"w":2.896428571}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE7250001","desc":"This course covers fixed income securities (including fixed income derivatives) and provides an introduction to the markets in which they are traded, as well as to the tools that are used to value these securities and to assess and manage their risk. Quantitative models play a key role in the valuation and risk management of these securities. In addition to course prerequisites, FNCE 6130 is recommended but not required.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. Note: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/) to request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. Prerequisites: FNCE 6110 and (STAT 6130 or STAT 6210)."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-7200","sid":"MGMT-7200-001","cu":1,"title":"Corporate Diplomacy","days":"M, W","st":825,"et":914,"cq":3,"iq":3.31,"diff":2.66,"work":3.08,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Witold Jerzy. Henisz","cq":3.000666667,"iq":3.308,"d":2.664,"w":3.082}],"syl":"https://coursesintouch.apps.upenn.edu/cpr/jsp/fast.do?webService=syll&t=202610&c=MGMT7200001","desc":"The financial significance of stakeholder opinions of the acceptability of a firm’s operations and geopolitical risk is mounting, yet the data, frameworks, and tools informing investors, consultants, and corporates are unreliable. The course provides students with novel data, frameworks, and tools that can link and aid in the alignment of stakeholder opinions of corporate impact on natural, social, and human capitals, financial valuation, strategy, and sustainable business. Estimates of the capital expenditures necessary to achieve a net-zero emissions and the 1.5 degrees Celsius global warming target exceed $50 Trillion over the next 30 years. The cost of inaction is, however, much higher, with $10-$25 Trillion dollars in annual losses forecast for GDP from the physical risks of climate change alone. Despite this simple financial calculus, we continue to debate whether climate change is real, and whether policies to achieve a climate transition are justified, and whether the allocation of the costs necessary to do so is fair. Such discussions are made more difficult by the reemergence of geopolitical rivalries between great powers as well as the strengthening of political divisions within many countries. Populism, nationalism, and nativism have moved from the fringes of political systems to the corridors of power. These international and national forces have led to a pause in globalization and increasingly threaten global growth. Which firms or investors are best poised to navigate these risks and seize related opportunities? This course provides students the latest tools to assess and map stakeholder opinions as well as integrate them into financial valuation. It also offers behavioral skills critical for external stakeholder engagement including communications as well as for the engagement of stakeholders inside the firm. In short, it prepares students to engage in geostrategy.\nWharton MBA Course. Course must be taken for a grade. MBA students must request enrollment for this class through Course Match and should not use the “Add to Cart” or “Request Permission” functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"REAL-8400","sid":"REAL-8400-401","cu":1,"title":"Adv Real Est Inv, Analys","days":"M","st":930,"et":1109,"cq":2.99,"iq":3.12,"diff":3.6,"work":3.54,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Todd M. Sinai","cq":2.992222222,"iq":3.116666667,"d":3.602222222,"w":3.54}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=REAL8400401","desc":"This course, is designed for majors in Real Estate, but is also open to finance-oriented students who wish a deeper analysis of real estate investment and investment analysis issues than that offered in REAL/FNCE 721. The class will contain a mixture of lectures, guest speakers and case discussions. Academic research is paired with recent industry analysis of key issues in order to marry sound theory and empirical results with current events and practices. Several classes will include lectures outlining what economics and finance tell us about a number of topics. Generally, these will be followed by guest lectures from industry professionals who will focus on a specific application of the principles introduced in the lectures. Format: Lecture, industry speakers.\nAuditors need permission. This class is open to non-Wharton students on a space-available basis. Non-Wharton students must place a permission request in the PATH system in order to be eligible to receive a permission to enroll. Wharton MBA Course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"LGST-8090","sid":"LGST-8090-401","cu":1,"title":"Sports Business Mgmt","days ons."},{"src":"2026A list (proxy)","sem":"2026A","cid":"OIDD-6150","sid":"OIDD-6150-001","cu":0.5,"title":"Operations Strategy","days":"M, W","st":615,"et":704,"cq":2.98,"iq":3.29,"diff":2.58,"work":2.44,"onList":"Yes","listCU":0.5,"listSec":3,"insts":[{"n":"Senthil Veeraraghavan","cq":2.980208333,"iq":3.289375,"d":2.582708333,"w":2.444583333}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=OIDD6150007","desc":"Operations strategy is about organizing people and resources to gain a competitive advantage in the delivery of products (both goods and services) to customers. This course approaches this challenge primarily from two perspectives: 1) how should a firm design their products so that they can be profitably offered; 2) how can a firm best organize and acquire resources to deliver its portfolio of products to customers. To be able to make intelligent decisions regarding these high-level choices, this course also provides a foundation of analytical methods. These methods give students a conceptual framework for understanding the linkage between how a firm manages its supply and how well that supply matches the firm's resulting demand. Specific course topics include designing service systems, managing inventory and product variety, capacity planning, approaches to sourcing and supplier management, constructing global supply chains, managing sustainability initiatives, and revenue management. This course emphasizes both quantitative tools and qualitative frameworks. Neither is more important than the other.\nWharton MBA course. Course must be taken for a grade. MBA students must request enrollment for this class via the application portal and should not use the \"Add to Cart\" or \"Request Permission\" functions. *First Class Attendance Mandatory*"},{"src":"2026A list (proxy)","sem":"2026A","cid":"OIDD-6150","sid":"OIDD-6150-003","cu":0.5,"title":"Operations Strategy","days":"M, W","st":825,"et":914,"cq":2.98,"iq":3.29,"diff":2.58,"work":2.44,"onL eation and continuous cost improvement. This course covers the key factors and methods involved in choosing and analyzing cost structures, and the cost management practices that can be strategically applied across the various functions of a business organization to analyze and forecast costs and to improve organizational performance. The course emphasizes the methods available to measure and evaluate costs for planning, forecasting, and decision-making. The material is designed for managers and consultants who will be involved in implementing cost management activities, as well as analysts, investors, and strategic planners involved in competitive cost analysis and financial forecasting.\nAuditors need permission. Wharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"LGST-8020","sid":"LGST-8020-401","cu":1,"title":"Global Corp Law & Mgmt","days":"T, R","st":930,"et":1019,"cq":2.98,"iq":3.26,"diff":2.58,"work":2.56,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Eric W. Orts","cq":2.978,"iq":3.264,"d":2.578,"w":2.556}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=LGST8020401","desc":"This course provides an introduction to the law of corporate management and finance. The course covers the roles of directors and managers under state corporate law and the federal securities laws. It also considers the rights and responsibilities of other major stakeholders, including shareholders, creditors, and employees. Particular attention is given to the law of mergers and acquisitions. Focus is on public corporations, but application of the law to venture firms is also discussed. Alternative organizational forms, such as LLCs, partnerships, and DAOs, are considered. Format: Socratic conversation and some lecture.\nMBA students must request enrollment for this class through Course Match and should not use the “Add to Cart” or “Request Permission” functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-7280","sid":"MGMT-7280-002","cu":0.5,"title":"Navigating Difficult Conversat","days":"W","st":930,"et":1109,"cq":2.97,"iq":3.21,"diff":1.84,"work":1.88,"onList":"Yes","listCU":0.5,"listSec":1,"insts":[{"n":"Katherine J. Klein","cq":2.97,"iq":3.21,"d":1.84,"w":1.88}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MGMT7280002","desc":"Learn the skills to navigate difficult conversations that arise in personal and professional settings. Whether it’s resolving team conflicts, giving constructive feedback, repairing a rift at work or at home, or addressing tough organizational challenges, this course equips you with the tools to communicate effectively and build stronger relationships. You’ll explore key concepts, strategies, and research on managing emotional triggers and handling high-stakes conversations. Through readings, discussions, and role-playing exercises, you’ll gain confidence in identifying what makes conversations succeed or fail, preparing for tough talks, and improving your ability to foster positive outcomes in work, relationships, and communities."},{"src":"2026A list (proxy)","sem":"2026A","cid":"ACCT-7420","sid":"ACCT-7420-401","cu":1,"title":"Fin Report & Bus Analys","days":"T, R","st":930,"et":1019,"cq":2.96,"iq":3.1,"diff":3.13,"work":2.99,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Paul E. Fischer","cq":2.959,"iq":3.099333333,"d":3.128666667,"w":2.991333333}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=ACCT7420401","desc":"This intensive one-semester course focuses on how to extract and interpret information in financial statements. The course adopts a user perspective of accounting by illustrating several specific accounting issues in a decision context.\nAuditors need permission. Wharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-8010","sid":"FNCE-8010-001","cu":1,"title":"Advanced Topics in PE","days":"T","st":1035,"et":1214,"cq":2.95,"iq":3.24,"diff":2.53,"work":2.47,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"David Bard","cq":2.948,"iq":3.238,"d":2.526,"w":2.472}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE8010001","desc":"The goal of this course is to put students in the seat of a private equity professional working on an investment from start to finish. Students will learn about the substance, process and mechanics of private equity investing, through the lens of the investment professional. The class will conduct a semester long case study, taking a specific transaction from the management presentation stage, to various modules in the deal process including: business diligence, industry diligence, accounting diligence, legal diligence, financial modeling, financing, valuation, negotiating the stock purchase agreement, and culminating in an investment committee presentation and recommendation. Working in teams, students will be required to build an integrated financial model to value the business, negotiate the key terms of the transaction agreements, and put together an investment committee presentation, defending their investment thesis and valuation. The class will also include several noteworthy guest speakers from the private equity industry and several smaller case studies to reinforce key topics.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. \nNote: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/)\nto request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. Prerequisites: FNCE 6110.\n"},{"src":"2026A list (proxy)","sem":"2026A","cid":"STAT-7100","sid":"STAT-7100-002","cu":0.5,"title":"Data Collect & Acquisit","days":"T, R","st":615,"et":704,"cq":2.95,"iq":3.32,"diff":1.95,"work":2.12,"onList":"Yes","listCU":0.5,"listSec":1,"insts":[{"n":"Richard Paul. Waterman","cq":2.9475,"iq":3.3225,"d":1.945,"w":2.1225}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=STAT7100002","desc":"This course will give students a solid grasp of different data collection strategies and when and how they can be applied in practice. At the same time, important current ideas such as data confidentiality and ethical considerations will be addressed. The students will have designed and fielded a sample survey and designed and fielded an online experiment (A/B test). Student will collect data through web scraping activities and/or using an API. Students will summarize their collected data and subsequent inferences, culminating with an in-class presentation. The course is structured in two parts. The first part is a \"Strategies\" component that addresses different data collection strategies. It will discuss sample designs, experimentation, and observational studies. The second part of the course is about \"Platforms\" and goes into the practicalities of the implementation of the different strategies. Given the data science perspective of this course, this is focused on web enabled approaches. Familiarity with either R or Python is expected and specifically the R-Studio or Jupyter notebooks platforms. Courses such as Stat 7050 or Stat 7770 would meet this requirement. Statistics, through the level of multiple regression is required. This requirement may be fulfilled with MBA courses such as Stat 6130/6210, or by waiving MBA statistics.\nThis is an MBA Course. Auditors need permission. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions.\n\n*********************************************************************** \nNOTICE TO OTHER (NON-MBA) GRAD STUDENTS: After MBA Course Match runs, there may be seats available for non-MBA graduate students. You should submit a permission request for the course in Path@Penn. We'll start processing permission requests in January.\n"},{"src":"2026A list (proxy)","sem":"2026A","cid":"REAL-7210","sid":"REAL-7210-402","cu":1,"title":"Real Estate Investments","days":"M, W","st":615,"et":704,"cq":2.91,"iq":3.09,"diff":2.98,"work":2.98,"onList":"Yes","listCU":1,"listSec":2,"insts":[{"n":"Todd M. Sinai","cq":2.907058824,"iq":3.089705882,"d":2.977647059,"w":2.980882353}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=REAL7210402","desc":"This course provides an introduction to real estate investing with a focus on financial and economic analysis. It is intended both as a foundational class for students considering a career in real estate as well as a survey class for students interested in finance who want to learn about the real estate sector. Project evaluation, financing strategies, risk assessment, investment decision making, and real estate capital markets are covered. No prior knowledge of the industry is required, but students will rapidly acquire a working knowledge of real estate markets and will quickly develop the quantitative tools to help them make investment decisions. Classes are conducted in a standard lecture format with discussion required. The course contains cases that help students evaluate the impact of more complex financing and capital markets tools used in real estate. There are three case studies and two midterms. FNCE 6110 is required as the class assumes comfort with Corporate Finance concepts and terms."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MGMT-8310","sid":"MGMT-8310-402","cu":0.5,"title":"Entrepreneurship Launchpad","days":"T, R","st":720,"et":809,"cq":2.89,"iq":3.38,"diff":2.31,"work":3.08,"onList":"Yes","li n about the real estate sector. Project evaluation, financing strategies, risk assessment, investment decision making, and real estate capital markets are covered. No prior knowledge of the industry is required, but students will rapidly acquire a working knowledge of real estate markets and will quickly develop the quantitative tools to help them make investment decisions. Classes are conducted in a standard lecture format with discussion required. The course contains cases that help students evaluate the impact of more complex financing and capital markets tools used in real estate. There are three case studies and two midterms. FNCE 6110 is required as the class assumes comfort with Corporate Finance concepts and terms."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MKTG-7790","sid":"MKTG-7790-001","cu":0.5,"title":"AI in Our Lives","days":"M, W","st":615,"et":704,"cq":2.88,"iq":3.24,"diff":1.55,"work":1.79,"onList":"Yes","listCU":0.5,"listSec":2,"insts":[{"n":"Stefano Puntoni","cq":2.8825,"iq":3.2425,"d":1.5475,"w":1.7925}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MKTG7790005","desc":"This course takes a behavioral perspective on the topic of autonomous technology, such as Artificial Intelligence. It reviews new insights to help companies thrive in the dawning age of smart machines. The emerging behavioral science of autonomous technology helps us understand barriers to consumer adoption and how to design captivating AI experiences. Moreover, we discuss how to improve managerial decision-making with data and algorithms. This is a non-technical course. No coding or data science skills are required. The course uses a blend of pedagogical approaches, including interactive lectures, workshops, guest lectures, and case discussions, to bridge two perspectives. On one side, we acknowledge the tremendous value that autonomous technology can provide to firms and individual consumers. In many ways, automation defines progress. On the other sid
