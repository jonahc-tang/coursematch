"onList":"Yes","listCU":1,"listSec":4,"insts":[{"n":"Christina Zhu","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=ACCT6130004","desc":"This course provides an introduction to both financial and managerial accounting, and emphasizes the analysis and evaluation of accounting information as part of the managerial processes of planning, decision-making, and control. A large aspect of the course covers the fundamentals of financial accounting. The objective is to provide a basic overview of financial accounting, including basic accounting concepts and principles, as well as the structure of the income statement, balance sheet, and statement of cash flows. The course also introduces elements of managerial accounting and emphasizes the development and use of accounting information for internal decisions. Topics include cost behavior and analysis, product and service costing, and relevant costs for internal decision-making. This course is recommended for students who will be using accounting information for managing manufacturing and service operations, controlling costs, and making strategic decisions, as well as those going into general consulting or thinking of starting their own businesses.\nAuditors need permission. Wharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"ACCT-6130","sid":"ACCT-6130-004","cu":1,"title":"Fin and Mngl Acct","days":"M, W","st":720,"et":809,"onList":"Yes","listCU":1,"listSec":4,"insts":[{"n":"Christina Zhu","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=ACCT6130004","desc":"This course provides an introduction to both financial and managerial accounting, and emphasizes the analysis and evaluation of accounting information as part of the managerial processes of planning, decision-making, and control. A large aspect of the course covers the fundamentals of financial accounting. The objective is to provide a basic overview of financial accounting, including basic accounting concepts and principles, as well as the structure of the income statement, balance sheet, and statement of cash flows. The course also introduces elements of managerial accounting and emphasizes the development and use of accounting information for internal decisions. Topics include cost behavior and analysis, product and service costing, and relevant costs for internal decision-making. This course is recommended for students who will be using accounting information for managing manufacturing and service operations, controlling costs, and making strategic decisions, as well as those going into general consulting or thinking of starting their own businesses.\nAuditors need permission. Wharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"HCMG-8740","sid":"HCMG-8740-001","cu":0.5,"title":"Bldg Value-Oriented HC Serv Co","days":"W","st":930,"et":1109,"onList":"Yes","listCU":0.5,"listSec":1,"insts":[{"n":"Andrew Hayek","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=HCMG8740001","desc":"The vast majority of new healthcare services companies fail, while a very small minority scale nationally, reaching their potential to serve patients and impact the healthcare system. The companies that defy the odds serve an important function in advancing our healthcare system: addressing unmet social and medical needs; bringing innovation in clinical models, technology, or service models; building workplaces that are more attractive for employees; and/or inspiring incumbent organizations to evolve their models.\nThis course follows the process of designing, launching and scaling value-oriented healthcare services companies – i.e., companies that aspire to advance the triple aim of healthcare (improving quality, experience and total cost of care). The course has a particular focus on assessing which NewCo ideas will be viable, designing of the clinical and economic models, partnering with providers (primary care, specialists and hospitals) and payers, building strong teams and culture, attracting capital, and ensuring long-term economic viability. We will follow the perspective of a practitioner, leveraging real-world examples and case studies, including guest speakers who share current experiences.\nThe course is directly relevant to students contemplating building or joining early-stage healthcare services companies; and, the course is also designed to be relevant to students who will be in roles that interact with these types of companies throughout their careers (e.g., as investors, consultants, investment bankers, hospital executives, health plan executives).\nMBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. This course is restricted to second-year HCMG majors only.\n"},{"src":"2026A list (proxy)","sem":"2026A","cid":"HCMG-9030","sid":"HCMG-9030-001","cu":1,"title":"Econ Hlth Cr & Policy","days":"W","st":540,"et":719,"onList":"No","insts":[{"n":"Alexander Olssen","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=HCMG9030001","desc":"This course applies basic economic concepts to analyze the health care market and evaluate health policies. The course begins with a discussion of productivity in health care and of the theoretical and empirical effects of asymmetric information and market failure. The second part of the course explores several topic areas in the health care economics literature: health insurance and the labor market; health policy interventions; and health as human capital. The third part of the course examines competition and the behavior of health care providers, with emphasis on the impact of policy on competition, behavior, and finally, bringing us full circle, health care productivity."},{"src":"2026A list (proxy)","sem":"2026A","cid":"HCMG-9020","sid":"HCMG-9020-001","cu":1,"title":"Industrial Org of Hc","days":"T","st":930,"et":1109,"onList":"No","insts":[{"n":"Claudio Lucarelli","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=HCMG9020001","desc":"This advanced PhD seminar will explore topics in the industrial organization of health care and structural econometric approaches in health economics. The focus in this course is the development of advanced econometric tools. The (tentative) topics covered include health insurance and hospital demand estimation, the analysis of hospital competition, insurer competition, quality competition, technology adoption, models of entry and exit and dynamic oligopoly games. The readings will focus on recent advances in economics. Students are required to present recent research from the field and write an empirical research paper that broadly based on the topics covered in the course. With the permission of the instructor, the seminar is open to doctoral students from departments other than Health Care Management.\nNon-majors need permission from department"},{"src":"2026A list (proxy)","sem":"2026A","cid":"ACCT-9410","sid":"ACCT-9410-301","cu":1,"title":"Research in Acct II","onList":"No","insts":[{"n":"Staff","cq":"N/A","iq":"N/A","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=ACCT9410301","desc":"This is Part II of a theoretical and empirical literature survey sequence covering topics that include corporate disclosure, cost of capital, incentives, compensation, governance, financial intermediation, financial reporting, tax, agency theory, cost accounting, capital structure, international financial reporting, analysts, and market efficiency. Please contact the accounting doctoral coordinator for information on the specific upcoming modules/topics that will be taught."},{"src":"2026A list (proxy)","sem":"2026A","cid":"ACCT-9300","sid":"ACCT-9300-301","cu":1,"title":"Empir Design in Acct Res","days":"F","st":720,"et":899,"onList":"No","insts":[{"n":"Daniel J. Taylor","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=ACCT9300301","desc":"This is an empirical research design course covering topics related to empirical methodology, causal inference, econometric analysis, and panel data approaches. At least one graduate level course in econometrics is recommended."},{"src":"2026A list (proxy)","sem":"2026A","cid":"ACCT-9810","sid":"ACCT-9810-301","cu":0.5,"title":"Workshop Colloquium I","onList":"No","insts":[{"n":"Luzi Hail","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=ACCT9810301","desc":"Students attend workshops in departments outside of accounting to provide student exposure to theory, research designs and methods that are being explored outside of accounting to provide breadth of exposure to foster innovative research ideas. Students are required to attend 7 non-accounting workshops over the semester and write up a referee report for 4 of those workshop papers. They are also required to write up at least one research proposal that stems from theories or research methods gleaned from one or more of the workshops attended."},{"src":"2026A list (proxy)","sem":"2026A","cid":"ACCT-9820","sid":"ACCT-9820-301","cu":0.5,"title":"Workshop Colloquium II","onList":"No","insts":[{"n":"Luzi Hail","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=ACCT9820301","desc":"Students attend workshops in departments outside of accounting to provide student exposure to theory, research designs and methods that are being explored outside of accounting to provide breadth of exposure to foster innovative research ideas. Students are required to attend 7 non-accounting workshops over the semester and write up a referee report for 4 of those workshop papers. They are also required to write up at least one research proposal that stems from theories or research methods gleaned from one or more of the workshops attended."},{"src":"2026A list (proxy)","sem":"2026A","cid":"LGST-6110","sid":"LGST-6110-001","cu":0.5,"title":"Resp in Global Mgmt","days":"T, R","st":510,"et":599,"onList":"Yes","listCU":0.5,"listSec":2,"insts":[{"n":"Aryeh Friedman","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=LGST6110002","desc":"This course uses the global business context to introduce students to important legal, ethical and cultural challenges they will face as business leaders. Cases and materials will address how business leaders, constrained by law and motivated to act responsibly in a global context, should analyze relevant variables to make wise decisions. Topics will include an introduction to the basic theoretical frameworks used in the analysis of ethical issues, such as right-based, consequentialist-based, and virtue-based reasoning, and conflicting interpretations of corporate responsibility. The course will include materials that introduce students to basic legal (common law vs. civil law) and normative (human rights) regimes at work in the global economy as well as sensitize them to the role of local cultural traditions in global business activity. Topics may also include such issues as comparative forms of corporate governance, bribery and corruption in global markets, human rights issues, diverse legal compliance systems, corporate responses to global poverty, global environmental responsibilities, and challenges arising when companies face conflicting ethical demands between home and local, host country mores. The pedagogy emphasizes globalized cases, exercises, and theoretical materials from the fields of legal studies, business ethics and social responsibility.\nWharton MBA course. Course must be taken for a grade. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"LGST-6110","sid":"LGST-6110-002","cu":0.5,"title":"Resp in Global Mgmt","days":"T, R","st":510,"et":599,"onList":"Yes","listCU":0.5,"listSec":2,"insts":[{"n":"Aryeh Friedman","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=LGST6110002","desc":"This course uses the global business context to introduce students to important legal, ethical and cultural challenges they will face as business leaders. Cases and materials will address how business leaders, constrained by law and motivated to act responsibly in a global context, should analyze relevant variables to make wise decisions. Topics will include an introduction to the basic theoretical frameworks used in the analysis of ethical issues, such as right-based, consequentialist-based, and virtue-based reasoning, and conflicting interpretations of corporate responsibility. The course will include materials that introduce students to basic legal (common law vs. civil law) and normative (human rights) regimes at work in the global economy as well as sensitize them to the role of local cultural traditions in global business activity. Topics may also include such issues as comparative forms of corporate governance, bribery and corruption in global markets, human rights issues, diverse legal compliance systems, corporate responses to global poverty, global environmental responsibilities, and challenges arising when companies face conflicting ethical demands between home and local, host country mores. The pedagogy emphasizes globalized cases, exercises, and theoretical materials from the fields of legal studies, business ethics and social responsibility.\nWharton MBA course. Course must be taken for a grade. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"LGST-6470","sid":"LGST-6470-001","cu":1,"title":"Bus and Governance of Water","days":"W","st":930,"et":1109,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Robert F. Powelson","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=LGST6470001","desc":"Virtually every business imaginable–from oil refining to semiconductor manufacturing to cloud computing—requires copious supplies of fresh water. However, there is a fixed amount of water on earth. As climate change makes many parts of the world hotter and drier, it is increasingly important for today’s business leaders to be able to understand water challenges and to implement solutions that will enable businesses to thrive in the future. In addition to understanding and navigating water quality and quantity challenges, business leaders thinking about water operate in a highly regulated environment at the local, national, and global levels. It is therefore important to understand who the key external stakeholders—both public and private—are and how to engage with them productively. Students are not expected to have any previous experience with the water industry.\nThis course will begin by focusing on global water risks and global, national, and local water governance. It will introduce students to how governments at many levels make and\nimplement water policy and how business leaders need to navigate managing water risks and opportunities within that environment. It will also cover private governance and water— considering how to engage with NGOs like the World Resources Institute and the CDP\n(formerly Carbon Disclosure Project) that operate on behalf of multiple stakeholders,\nincluding investors in this space. The course will examine the duties of corporate officers and directors in developing and implementing a firm’s water sustainability program, how major water projects are financed, and the business ethics issues surrounding “doing the right thing” in a module on water and ESG (environmental, social and governance factors). It will conclude with an “H2O Shark Tank” exercise where student groups pitch their best ideas for sustainable water solutions to a panel of potential funders, including investment banks, corporate executives, and foundation leaders.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the “Add to Cart” or “Request Permission” functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"LGST-6430","sid":"LGST-6430-001","cu":1,"title":"Other People's Money","days":"W","st":930,"et":1109,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Rory Van Loo","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=LGST6430001","desc":"We learn in introductory economics courses that money is fungible: that is, one dollar is as good as the next. Indeed, using money as a \"medium of exchange\" is one of its defining characteristics. But what happens when we take a big pile of money and put it in different buckets. On one bucket we might write \"hedge fund\"; on another, \"central bank\"; on still another, \"payday lender.\" Then money starts to change in ways defined by law, history, ethics, and politics. This course will take you on a tour of these different buckets--different kinds of financial institutions, broadly defined--throughout the modern financial system. We will look at hedge funds, insurance companies, investment banks, sovereign wealth funds, central banks, consumer banks, payday lenders, state-sponsored enterprises (like the Export-Import Bank in the United States and much of the financial system in China), and the cutting edge of fintech, including crowd-funded lending, digital currencies, and more. In each case, students will be exposed to a series of specialized questions: Where did this institution come from? What problem is it trying to solve that other alternatives could not resolve? What is the basic business (or, where relevant, regulatory) model for each institution? How is each institution regulated, and by whom? What are the ethical considerations in each context? What are the political considerations that each market participant faces?\nWharton MBA Course. MBA students must request enrollment for this class through Course Match and should not use the “Add to Cart” or “Request Permission” functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"LGST-8060","sid":"LGST-8060-401","cu":1,"title":"Negotiations","days":"M, W","st":825,"et":914,"onList":"Yes","listCU":1,"listSec":9,"insts":[{"n":"Erik Santoro","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=LGST8060414","desc":"This course examines the art and science of negotiation, with additional emphasis on conflict resolution. Students will engage in a number of simulated negotiations ranging from simple one-issue transactions to multi-party joint ventures. Through these exercises and associated readings, students explore the basic theoretical models of bargaining and have an opportunity to test and improve their negotiation skills. Cross-listed with MGMT 6910/OIDD 6910/LGST 8060. Format: Lecture, class discussion, simulation/role play, and video demonstrations. Materials: Textbook and course pack.\nWharton MBA course. Course must be taken for a grade. Auditors need permission. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"LGST-8060","sid":"LGST-8060-402","cu":1,"title":"Negotiations","days":"M, W","st":930,"et":1019,"onList":"Yes","listCU":1,"listSec":9,"insts":[{"n":"Erik Santoro","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=LGST8060414","desc":"This course examines the art and science of negotiation, with additional emphasis on conflict resolution. Students will engage in a number of simulated negotiations ranging from simple one-issue transactions to multi-party joint ventures. Through these exercises and associated readings, students explore the basic theoretical models of bargaining and have an opportunity to test and improve their negotiation skills. Cross-listed with MGMT 6910/OIDD 6910/LGST 8060. Format: Lecture, class discussion, simulation/role play, and video demonstrations. Materials: Textbook and course pack.\nWharton MBA course. Course must be taken for a grade. Auditors need permission. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"LGST-9210","sid":"LGST-9210-301","cu":1,"title":"Foundations of Bus Law","days":"M","st":720,"et":899,"onList":"No","insts":[{"n":"Amanda Ward. Shanor","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=LGST9210301","desc":"This course will introduce students to basic jurisprudential discussions and debates that relate to understanding business in society. Topics will include a general overview of the nature of law and its relationship to ethics; history of legal thought, business in society; theories of contract, torts, and property; criminal law as it applies to business situations; and theories of the business enterprise and its regulation. Selected topics will also be chosen in accordance with the interest of participants in the seminar."},{"src":"2026A list (proxy)","sem":"2026A","cid":"BEPP-7080","sid":"BEPP-7080-401","cu":1,"title":"Housing Markets","days":"R","st":930,"et":1109,"pricedAs":"REAL-7080-401","onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Allison Shertzer","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=BEPP7080401","desc":"This course is designed for students interested in the economics and operations of housing markets. It is primarily a U.S.-focused course. The class is divided into five sections: (1) economic analysis of housing market fundamentals (supply and demand); (2) a policy analysis section on housing affordability issues in the U.S.; (3) operations of homebuilders and rental landlords, as well as the single family rental sector; this section includes a series of guest lecturers from industry executives; (4) the nature of housing cycles; and (5) a discussion of factors that have affected the evolution of housing markets over the long run.\nThis course presumes knowledge of intermediate microeconomics. For Wharton students, this means you must have passed MGEC 6110. Non-Wharton students should have taken the equivalent course in the College. The class is primarily lecture based, although we will have one flipped class, as well as a number of guest lecturers from industry. There are two in-class midterms and two assignments.\nAuditors need permission. This class is open to non-Wharton students on a space-available basis. Non-Wharton students must place a permission request in the PATH system in order to be eligible to receive a permission to enroll.\n\nWharton MBA Course. \n\nMBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"BEPP-7610","sid":"BEPP-7610-401","cu":1,"title":"Climate Risks and Opportunitie","days":"M, W","st":825,"et":914,"pricedAs":"FNCE-7610-401","onList":"No","insts":[{"n":"Parinitha Sastry","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=BEPP7610402","desc":"Climate change represents one of the most urgent threats to humanity’s future. Transforming the global economy to manage this threat will require trillions of dollars in capital, creating unprecedented risks as well as opportunities in financial markets. This course uses the tools of financial economics to understand strategies for managing risks and financing climate technologies across a range of asset classes, including carbon markets, project finance, venture capital, private equity, public equities, fixed income, and real assets. Students will also explore how financing strategies interact with public policy and political risk in both the developed and emerging market contexts. The course concludes with debates on corporate purpose, including what role businesses and financial institutions should play in addressing climate change."},{"src":"2026A list (proxy)","sem":"2026A","cid":"BEPP-7610","sid":"BEPP-7610-402","cu":1,"title":"Climate Risks and Opportunitie","days":"M, W","st":930,"et":1019,"pricedAs":"FNCE-7610-402","onList":"No","insts":[{"n":"Parinitha Sastry","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=BEPP7610402","desc":"Climate change represents one of the most urgent threats to humanity’s future. Transforming the global economy to manage this threat will require trillions of dollars in capital, creating unprecedented risks as well as opportunities in financial markets. This course uses the tools of financial economics to understand strategies for managing risks and financing climate technologies across a range of asset classes, including carbon markets, project finance, venture capital, private equity, public equities, fixed income, and real assets. Students will also explore how financing strategies interact with public policy and political risk in both the developed and emerging market contexts. The course concludes with debates on corporate purpose, including what role businesses and financial institutions should play in addressing climate change."},{"src":"2026A list (proxy)","sem":"2026A","cid":"BEPP-9320","sid":"Unknown","cu":1,"title":"Contract Thry & Applcatn","onList":"No","insts":[{"n":"Staff","cq":"N/A","iq":"N/A","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=BEPP9320001","desc":"The course provides an advanced introduction to the theory of contracts and its mixture of foundational theories and applications to fields such as labor, reguindustrial organization."},{"src":"2026A list (proxy)","sem":"2026A","cid":"BEPP-9000","sid":"BEPP-9000-401","cu":0.5,"title":"Research Seminar","days":"T","st":720,"et":809,"onList":"No","insts":[{"n":"Jessie Handbury","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=BEPP9000401","desc":"Of the many ways that doctoral students typically learn how to do research, two that are important are watching others give seminar presentations (as in Applied Economics Seminars) and presenting one's own research. The BEPP 9000 course provides a venue for the latter. Wharton doctoral students enrolled in this course present applied economics research. Presentations both of papers assigned for other classes and of research leading toward a dissertation are appropriate in BEPP 9000. This course aims to help students further develop a hands-on understanding of the research process. All doctoral students with applied microeconomic interests are encouraged to attend and present. Second and third year Applied Economic Ph.D. students are required to enroll in BEPP 9000 and receive one-semester credit per year of participation."},{"src":"2026A list (proxy)","sem":"2026A","cid":"BEPP-9620","sid":"BEPP-9620-401","cu":0.5,"title":"Applied Economics Seminar","days":"M, W","st":720,"et":809,"onList":"No","insts":[{"n":"Eduardo Azevedo","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=BEPP9620401","desc":"The goal of this course is to help doctoral students develop critical thinking skills through both seminar participation and writing of referee reports. To this end, students will attend the Wharton Applied Economics seminar when it meets each Wednesday at noon; prepare two written referee reports on WAE papers per semester, due before the seminar is presented. After attending the seminar and the ensuing discussion of the paper, students will prepare follow-up evaluations of their referee reports, due one week after the seminar."},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-6210","sid":"FNCE-6210-001","cu":0.5,"title":"Corporate Finance (Half CU)","days":"M, W","st":510,"et":599,"onList":"Yes","listCU":0.5,"listSec":4,"insts":[{"n":"Itamar Drechsler","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE6210004","desc":"This half-semester course serves as an introduction to corporate investments for non-majors. The primary objective is to provide a framework, concepts, and tools for analyzing financial decisions based on fundamental principles of modern financial theory. Topics covered include discounted cash flow techniques, corporate capital budgeting and valuation, investment decisions under uncertainty, and capital asset pricing. The approach is rigorous and analytical but the course will not cover several topics included in the full semester Corporate Finance course, including: market efficiency, corporate financial policy (including capital structure, cost of capital, dividend policy, and related issues), and options.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. Course must be taken for a grade. Note: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/)\nto request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. \n\n\n\n"},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-6210","sid":"FNCE-6210-002","cu":0.5,"title":"Corporate Finance (Half CU)","days":"M, W","st":615,"et":704,"onList":"Yes","listCU":0.5,"listSec":4,"insts":[{"n":"Itamar Drechsler","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE6210004","desc":"This half-semester course serves as an introduction to corporate investments for non-majors. The primary objective is to provide a framework, concepts, and tools for analyzing financial decisions based on fundamental principles of modern financial theory. Topics covered include discounted cash flow techniques, corporate capital budgeting and valuation, investment decisions under uncertainty, and capital asset pricing. The approach is rigorous and analytical but the course will not cover several topics included in the full semester Corporate Finance course, including: market efficiency, corporate financial policy (including capital structure, cost of capital, dividend policy, and related issues), and options.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. Course must be taken for a grade. Note: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/)\nto request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. \n\n\n\n"},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-6210","sid":"FNCE-6210-003","cu":0.5,"title":"Corporate Finance (Half CU)","days":"M, W","st":825,"et":914,"onList":"Yes","listCU":0.5,"listSec":4,"insts":[{"n":"Itamar Drechsler","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE6210004","desc":"This half-semester course serves as an introduction to corporate investments for non-majors. The primary objective is to provide a framework, concepts, and tools for analyzing financial decisions based on fundamental principles of modern financial theory. Topics covered include discounted cash flow techniques, corporate capital budgeting and valuation, investment decisions under uncertainty, and capital asset pricing. The approach is rigorous and analytical but the course will not cover several topics included in the full semester Corporate Finance course, including: market efficiency, corporate financial policy (including capital structure, cost of capital, dividend policy, and related issues), and options.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. Course must be taken for a grade. Note: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/)\nto request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. \n\n\n\n"},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-6210","sid":"FNCE-6210-004","cu":0.5,"title":"Corporate Finance (Half CU)","days":"M, W","st":930,"et":1019,"onList":"Yes","listCU":0.5,"listSec":4,"insts":[{"n":"Itamar Drechsler","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE6210004","desc":"This half-semester course serves as an introduction to corporate investments for non-majors. The primary objective is to provide a framework, concepts, and tools for analyzing financial decisions based on fundamental principles of modern financial theory. Topics covered include discounted cash flow techniques, corporate capital budgeting and valuation, investment decisions under uncertainty, and capital asset pricing. The approach is rigorous and analytical but the course will not cover several topics included in the full semester Corporate Finance course, including: market efficiency, corporate financial policy (including capital structure, cost of capital, dividend policy, and related issues), and options.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. Course must be taken for a grade. Note: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/)\nto request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. \n\n\n\n"},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-7450","sid":"FNCE-7450-401","cu":1,"title":"Hedge Funds","days":"M","st":930,"et":1109,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Bilge Yilmaz","cq":"N/A","iq":"New","d":"N/A","w":"N/A"},{"n":"Ronen Israel","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE7450401","desc":"This course will cover critical aspects and characteristics of hedge funds and the hedge fund industry. It will look at the legal foundations and structures of hedge funds including the primary regulations in the U.S. and abroad that are most relevant for hedge funds. It will also present the major hedge fund strategies, describe operation, control, administration, due diligence and valuation issues. Performance evaluation and investing in hedge funds from the investor's perspective will be discussed as will be issues of potential changes in regulation, risk management, and the use of leverage. The format of the course will mix lectures with presentations from industry participants, hedge fund managers, those who invest in hedge funds, those who advise them and provide services to them, and those who regulate them. Those who want to launch a hedge fund, join an existing one, invest in one, or provide services to one will want to register for this course.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. Note: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/) to request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. Prerequisites: FNCE 6110."},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-7510","sid":"FNCE-7510-001","cu":0.5,"title":"Fnce of Buyouts & Acqs","days":"M, W","st":615,"et":704,"onList":"Yes","listCU":0.5,"listSec":2,"insts":[{"n":"Bilge Yilmaz","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE7510001","desc":"The course focuses on financial tools, techniques, and best practices used in buyouts (financial buyers) and acquisitions (strategic buyers). While it will touch upon various strategic, organizational, and general management issues, the main lens for studying these transactions will be a financial one. It will explore how different buyers approach the process of finding, evaluating, and analyzing opportunities in the corporate-control market; how they structure deals and how deal structure affects both value creation and value division; how they add value after transaction completion; and how they realize their ultimate objectives (such as enhanced market position or a profitable exit). The course is divided into two broad modules. The first module covers mergers and acquisitions, and the second one studies buyouts by private equity partnerships. FNCE 7030 or FNCE 7070 are recommended.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. Note: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/) to request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. Prerequisites: FNCE 6110."},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-7610","sid":"FNCE-7610-401","cu":1,"title":"Climate Risks and Opportunitie","days":"M, W","st":825,"et":914,"onList":"No","insts":[{"n":"Parinitha Sastry","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE7610402","desc":"Climate change represents one of the most urgent threats to humanity’s future. Transforming the global economy to manage this threat will require trillions of dollars in capital, creating unprecedented risks as well as opportunities in financial markets. This course uses the tools of financial economics to understand strategies for managing risks and financing climate technologies across a range of asset classes, including carbon markets, project finance, venture capital, private equity, public equities, fixed income, and real assets. Students will also explore how financing strategies interact with public policy and political risk in both the developed and emerging market contexts. The course concludes with debates on corporate purpose, including what role businesses and financial institutions should play in addressing climate change.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. Note: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/) to request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. Prerequisites: FNCE 6110."},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-7610","sid":"FNCE-7610-402","cu":1,"title":"Climate Risks and Opportunitie","days":"M, W","st":930,"et":1019,"onList":"No","insts":[{"n":"Parinitha Sastry","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE7610402","desc":"Climate change represents one of the most urgent threats to humanity’s future. Transforming the global economy to manage this threat will require trillions of dollars in capital, creating unprecedented risks as well as opportunities in financial markets. This course uses the tools of financial economics to understand strategies for managing risks and financing climate technologies across a range of asset classes, including carbon markets, project finance, venture capital, private equity, public equities, fixed income, and real assets. Students will also explore how financing strategies interact with public policy and political risk in both the developed and emerging market contexts. The course concludes with debates on corporate purpose, including what role businesses and financial institutions should play in addressing climate change.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. Note: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/) to request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. Prerequisites: FNCE 6110."},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-7680","sid":"FNCE-7680-401","cu":1,"title":"Trading Securities","days":"M, W","st":825,"et":914,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Jessica A. Wachter","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE7680401","desc":"What determines how securities are traded? How do fixed-income markets\ndiffer from equity markets and why? What is the role for government regulation\nin proper design of securities markets? These are some of the questions\nwe will explore, taking a rigorous but real-world perspective, that focuses on\nthe contemporary problems such as the rise of social networks, flash rallies\nand crashes, the advent of cryptocurrency, and the continued march forward\nof technology and innovation. While our focus is on market intermediation,\nwe will maintain the perspective of the main purpose of markets: to provide\ninformation, to create liquidity, and to allow funds to flow to where they are\nmost needed.\nWharton MBA course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions. Note: Non-Wharton students use the waitlist form located on Finance Dept. website (https://fnce.wharton.upenn.edu/programs/mba/) to request a seat in this course. Also add a permission request in PATH. Contact (fnce-courses@wharton.upenn.edu) with any questions. Prerequisites: FNCE 6110."},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-9500","sid":"FNCE-9500-001","cu":1,"title":"Research Seminar in Fin","days":"R","st":720,"et":809,"onList":"No","insts":[{"n":"Staff","cq":"N/A","iq":"N/A","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE9500004","desc":"This course may be offered (and taken by a student) several times a year with varying topics.\nWharton Doctoral Course"},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-9500","sid":"FNCE-9500-002","cu":1,"title":"Research Seminar in Fin","days":"W","st":720,"et":809,"onList":"No","insts":[{"n":"Staff","cq":"N/A","iq":"N/A","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE9500004","desc":"This course may be offered (and taken by a student) several times a year with varying topics.\nWharton Doctoral Course"},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-9500","sid":"FNCE-9500-003","cu":1,"title":"Research Seminar in Fin","days":"M","st":720,"et":809,"onList":"No","insts":[{"n":"Staff","cq":"N/A","iq":"N/A","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE9500004","desc":"This course may be offered (and taken by a student) several times a year with varying topics.\nWharton Doctoral Course"},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-9500","sid":"FNCE-9500-004","cu":1,"title":"Research Seminar in Fin","days":"T","st":720,"et":809,"onList":"No","insts":[{"n":"Staff","cq":"N/A","iq":"N/A","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE9500004","desc":"This course may be offered (and taken by a student) several times a year with varying topics.\nWharton Doctoral Course"},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-9360","sid":"FNCE-9360-001","cu":0.5,"title":"Household Finance","days":"W","st":825,"et":1004,"onList":"No","insts":[{"n":"Nikolai Roussanov","cq":"N/A","iq":"New","d":"N/A","w":"N/A"},{"n":"Sylvain Catherine","cq":"N/A","iq":"New","d":"N/A","w":"N/A"},{"n":"Lu Liu","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE9360001","desc":"The primary goal of this 0.5cu course is to introduce students to the main areas of research in household finance. The emphasis will be on discussing papers on the research frontier on topics such as consumption, portfolio choices, housing, inequality and entrepreneurship.\nThis course complements REAL 9480, Advanced Topics in Urban Economics: Household Real Estate Decisions-Making. Students are encouraged to take REAL 9480 in the first half of the spring semester and FNCE 9360 in the second half of that semester.\nWharton Doctoral Course. Undergraduates need permission. Contact (fnce-courses@wharton.upenn.edu) with any questions. Prerequisites: FNCE 9110."},{"src":"2026A list (proxy)","sem":"2026A","cid":"FNCE-9260","sid":"FNCE-9260-001","cu":1,"title":"Empirical Meth Corp Fn","days":"T","st":825,"et":1004,"onList":"No","insts":[{"n":"Lucian Taylor","cq":"N/A","iq":"New","d":"N/A","w":"N/A"},{"n":"Sylvain Catherine","cq":"N/A","iq":"New","d":"N/A","w":"N/A"},{"n":"Daniel Gregory. Garrett","cq":"N/A","iq":"New","d":"N/A","w":"N/A"},{"n":"Sasha Scarlett. Indarte","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=FNCE9260001","desc":"The course will cover a variety of micro-econometric models and methods including panel data models, program evaluation methods e.g. difference in differences, matching techniques, regression discontinuity design, instrumental variables, duration models, structural estimation, simulated methods of moments. The structure of the course consists of lectures, student presentations, and empirical exercises. Published studies will be utilized in a variety of fields such as corporate finance, labor economics, and industrial organization to illustrate the various techniques. The goal of the course is to provide students with a working knowledge of various econometric techniques that they can apply in their own research. As such, the emphasis of the course is on applications, not theory. Students are required to have taken a graduate sequence in Econometrics, you should be comfortable with econometrics at the level of William Green's \"Econometric Analysis of Cross-Section and Panel Data\".\nWharton Doctoral Course. Undergraduates need permission. Contact (fnce-courses@wharton.upenn.edu) with any questions. Prerequisites: STAT 5210."},{"src":"2026A list (proxy)","sem":"2026A","cid":"REAL-7080","sid":"REAL-7080-401","cu":1,"title":"Housing Markets","days":"R","st":930,"et":1109,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Allison Shertzer","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=REAL7080401","desc":"This course is designed for students interested in the economics and operations of housing markets. It is primarily a U.S.-focused course. The class is divided into five sections: (1) economic analysis of housing market fundamentals (supply and demand); (2) a policy analysis section on housing affordability issues in the U.S.; (3) operations of homebuilders and rental landlords, as well as the single family rental sector; this section includes a series of guest lecturers from industry executives; (4) the nature of housing cycles; and (5) a discussion of factors that have affected the evolution of housing markets over the long run.\nThis course presumes knowledge of intermediate microeconomics. For Wharton students, this means you must have passed MGEC 6110. Non-Wharton students should have taken the equivalent course in the College. The class is primarily lecture based, although we will have one flipped class, as well as a number of guest lecturers from industry. There are two in-class midterms and two assignments.\nAuditors need permission. This class is open to non-Wharton students on a space-available basis. Non-Wharton students must place a permission request in the PATH system in order to be eligible to receive a permission to enroll. Wharton MBA Course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"REAL-7240","sid":"REAL-7240-401","cu":1,"title":"Urban Real Estate Econ","days":"T, R","st":615,"et":704,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Gilles Duranton","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=REAL7240401","desc":"Urban Real Estate Economics uses economic concepts to analyze real estate markets, values, and trends. The course focuses on market dynamics in the U.S. and internationally, with an emphasis on how urban growth and local and federal government policies impact urban development and real estate pricing. A group development project gives hands on experience, and invited guest speakers bring industry knowledge. Besides the group project and presentation, problem sets are required along with a midterm and optional second exam. Lecture with discussion required.\nAuditors need permission. This class is open to non-Wharton students on a space-available basis. Non-Wharton students must place a permission request in the PATH system in order to be eligible to receive a permission to enroll. Wharton MBA Course. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions."},{"src":"2026A list (proxy)","sem":"2026A","cid":"REAL-9000","sid":"REAL-9000-401","cu":0.5,"title":"Research Seminar","days":"T","st":720,"et":809,"onList":"No","insts":[{"n":"Jessie Handbury","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=REAL9000401","desc":"Of the many ways that doctoral students typically learn how to do research, two that are important are watching others give seminar presentations (as in Applied Economics Seminars) and presenting one's own research. The BEPP 9000 course provides a venue for the latter. Wharton doctoral students enrolled in this course present applied economics research. Presentations both of papers assigned for other classes and of research leading toward a dissertation are appropriate in BEPP 9000. This course aims to help students further develop a hands-on understanding of the research process. All doctoral students with applied microeconomic interests are encouraged to attend and present. Second and third year Applied Economic Ph.D. students are required to enroll in BEPP 9000 and receive one-semester credit per year of participation."},{"src":"2026A list (proxy)","sem":"2026A","cid":"REAL-9480","sid":"REAL-9480-001","cu":0.5,"title":"House Real Est Decision","days":"R","st":825,"et":1004,"onList":"No","insts":[{"n":"Benjamin J. Keys","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=REAL9480001","desc":"In this course we will study theory and evidence of how households make decisions surrounding real estate, how they interact with the financial sector, and how housing and mortgage choices influence urban markets and household balance sheets. We will examine real estate decisions from both supply and demand perspectives. There will be a special focus on the tools of modern empirical research, emphasizing the many challenges to causal identification and popular methodologies to overcome and address these challenges. The course will cover topics in mortgage choice, refinancing, renegotiation, default and foreclosure, discrimination, housing search, and market segmentation.\nPrerequisites:\nThe course assumes that students have familiarity with standard first year econometrics and microeconomics."},{"src":"2026A list (proxy)","sem":"2026A","cid":"REAL-9620","sid":"REAL-9620-401","cu":0.5,"title":"Applied Economics Seminar","days":"M, W","st":720,"et":809,"onList":"No","insts":[{"n":"Eduardo Azevedo","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=REAL9620401","desc":"The goal of this course is to help doctoral students develop critical thinking skills through both seminar participation and writing of referee reports. To this end, students will attend the Wharton Applied Economics seminar when it meets each Wednesday at noon; prepare two written referee reports on WAE papers per semester, due before the seminar is presented. After attending the seminar and the ensuing discussion of the paper, students will prepare follow-up evaluations of their referee reports, due one week after the seminar."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MKTG-9400","sid":"MKTG-9400-301","cu":0.5,"title":"Meas Data Analys Mktg A","days":"M","st":825,"et":1004,"onList":"No","insts":[{"n":"Christophe Van Den Bulte","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MKTG9400301","desc":"MKTG 9400 and MKTG 9410 provide an understanding and working knowledge of statistical data analysis for assessing how one variable is predicted (and possibly caused) by other variables. The courses focus on \"funny Y's and messy X's\" and extend the students' tool kit beyond classic linear regression and ANOVA in two directions. (1) Analyzing binary data, ordered response data, choice data, count data, truncated or censored data, and duration data; (2) Identifying and tackling causal identification challenges when analyzing non-experimental data. All assignments can be completed using R, SAS, or Stata.\nThis is a Doctoral level course and requires instructor permission. Request a permit through Path@Penn and your request will be forwarded to the instructor for a decision. Course must be taken for a letter grade."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MKTG-9550","sid":"MKTG-9550-302","cu":0.5,"title":"Econ/Or Models in Mktg B","days":"T","st":930,"et":1109,"onList":"No","insts":[{"n":"Zhong Zhang","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MKTG9550302","desc":"This is a continuation of MKTG 954. This doctoral seminar reviews analytical models relevant to improving various aspects of marketing decisions such as new product launch, product line design, pricing strategy, advertising decisions, sales force organization and compensation, distribution channel design and promotion decisions. The primary focus will be on analytical models. The seminar will introduce the students to various types of analytical models used in research in marketing, including game theory models for competitive analysis, agency theory models for improving organization design and incentives within organizations, and optimization methods to improve decision making and resource allocation. The course will enable students to become familiar with applications of these techniques in the marketing literature and prepare the students to apply these and other analytical approaches to research problems that are of interest to the students.\nThis is a Doctoral level course and requires instructor permission. Request a permit through Path@Penn and your request will be forwarded to the instructor for a decision. Course must be taken for a letter grade."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MKTG-9500","sid":"MKTG-9500-301","cu":0.5,"title":"Jdgmnt & Dec Making Cb A","days":"W","st":510,"et":689,"onList":"No","insts":[{"n":"Barbara Ann. Mellers","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MKTG9500301","desc":"The purpose of this course is to provide a solid foundation for critical thinking and research on the judgment, decision-making and choice aspects of consumer behavior. There is a focus on how people process information when making judgments and choices and how the processes of judgment and choice might be improved. Topics of discussion include rationality, judgment under uncertainty, judgment heuristics and biases, risk taking, dealing with conflicting values, framing effects, prospect theory, inter-temporal choice, preference formation, and the psychology of utility. The focus will be on the individual decision-maker, although the topics will also have some applicability to group and organizational decision-making and behavioral research methodologies.\nThis is a Doctoral level course and requires instructor permission. Request a permit through Path@Penn and your request will be forwarded to the instructor for a decision. Course must be taken for a letter grade."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MKTG-9410","sid":"MKTG-9410-302","cu":0.5,"title":"Meas Data Analys Mktg B","days":"M","st":825,"et":1004,"onList":"No","insts":[{"n":"Christophe Van Den Bulte","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MKTG9410302","desc":"MKTG 9400 and MKTG 9410 provide an understanding and working knowledge of statistical data analysis for assessing how one variable is predicted (and possibly caused) by other variables. The courses focus on \"funny Y's and messy X's\" and extend the students' tool kit beyond classic linear regression and ANOVA in two directions. (1) Analyzing binary data, ordered response data, choice data, count data, truncated or censored data, and duration data; (2) Identifying and tackling causal identification challenges when analyzing non-experimental data. All assignments can be completed using R, SAS, or Stata.\nThis is a Doctoral level course and requires instructor permission. Request a permit through Path@Penn and your request will be forwarded to the instructor for a decision. Course must be taken for a letter grade."},{"src":"2026A list (proxy)","sem":"2026A","cid":"MKTG-9540","sid":"MKTG-9540-301","cu":0.5,"title":"Econ/Or Models in Mktg A","days":"T","st":825,"et":1004,"onList":"No","insts":[{"n":"Jagmohan Singh. Raju","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=MKTG9540301","desc":"This doctoral seminar reviews analytical models relevant to improving various aspects of marketing decisions such as new product launch, product line design, pricing strategy, advertising decisions, sales force organization and compensation, distribution channel design and promotion decisions. The primary focus will be on analytical models. The seminar will introduce the students to various types of analytical models used in research in marketing, including game theory models for competitive analysis, agency theory models for improving organization design and incentives within organizations, and optimization methods to improve decision making and resource allocation. The course will enable students to become familiar with applications of these techniques in the marketing literature and prepare the students to apply these and other analytical approaches to research problems that are of interest to the students.\nThis is a Doctoral level course and requires instructor permission. Request a permit through Path@Penn and your request will be forwarded to the instructor for a decision. Course must be taken for a letter grade."},{"src":"2026A list (proxy)","sem":"2026A","cid":"STAT-7230","sid":"STAT-7230-401","cu":1,"title":"Machine Learning in Business","days":"T, R","st":1035,"et":1124,"onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Kaihua Ding","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=STAT7230401","desc":"This course introduces students to machine learning techniques used in business applications. The main topics include: cross validation, variable selection procedures, shrinkage methods such as lasso, logistic regression, k-nearest neighbors, ROC curves and confusion matrix, trees, kernel based learning, resampling techniques, random forests, boosting, neural networks & deep learning, matrix methods including singular value decomposition (SVD) and its application in principal component analysis (PCA), and some unsupervised methods such as k-means and density based clustering.\nStudents will learn to apply these methods in a wide range of settings such as marketing and finance, and will gain hands-on experience through class assignments and competitions.\nThis is an MBA Course. Auditors need permission. MBA students must request enrollment for this class through Course Match and should not use the \"Add to Cart\" or \"Request Permission\" functions.\n\n*********************************************************************** \nNOTICE TO OTHER (NON-MBA) GRAD STUDENTS: After MBA Course Match runs, there may be seats available for non-MBA graduate students. You should submit a permission request for the course in Path@Penn. We'll start processing permission requests in January."},{"src":"2026A list (proxy)","sem":"2026A","cid":"STAT-9310","sid":"STAT-9310-401","cu":1,"title":"Stochastic Processes","days":"M, W","st":825,"et":914,"onList":"No","insts":[{"n":"Ahmed M. Bou-Rabee","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=STAT9310401","desc":"Continuation of MATH 6480/STAT 9300, the 2nd part of Probability Theory for PhD students in the math or statistics department. The main topics include Brownian motion, martingales, Ito's formula, and their applications to random walk and PDE.\nUndergraduates need permission."},{"src":"2026A list (proxy)","sem":"2026A","cid":"STAT-9800","sid":"STAT-9800-001","cu":1,"title":"Intro to Biomed Data Science","days":"F","st":930,"et":1109,"onList":"No","insts":[{"n":"Bingxin Zhao","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=STAT9800001","desc":"This course offers a comprehensive introduction to biomedical data science research,\ntailored for graduate students from Statistics and various interdisciplinary domains.\nAimed at facilitating end-to-end data science research capabilities, this course covers\nthe development and application of computational methods and statistical techniques\nfor analyzing voluminous datasets, particularly in biology, healthcare, and medicine.\nStudents will gain insights into various data types prevalent in biomedical research,\nemerging large-scale data resources, and the art of formulating scientific questions.\nThe course encompasses methodology research, scientific research, collaborative\nresearch, computing tools, software development, as well as scientific writing,\nincluding both research papers and grant proposals. By the end of the course, students\nwill be equipped with the foundational skills and knowledge required to excel as\nstatisticians and research scientists, whether they choose to pursue a career in industry\nor academia.\nPrerequisite:\nFor students from the STAT department, this course is tailored for those who have successfully completed the qualifying exam and are ready to embark on their research journey. Exceptions for first-year students will be considered on an individual basis.\nFor master's or Ph.D. students from other departments or programs, such as AMCS, the\nprerequisites will differ based on their specific curriculum. At a minimum, students should have master-level expertise in one or more of the following areas: applied mathematics and probability, computing and software development, web development, bioinformatics,\nbiostatistics, epidemiology, computational biology, genetics/genomics, neuroscience,\nradiology, and medical imaging."},{"src":"2026A list (proxy)","sem":"2026A","cid":"STAT-9916","sid":"STAT-9916-301","cu":0.5,"title":"Sem in Adv Appl of Stat","days":"F","st":540,"et":720,"onList":"No","insts":[{"n":"Giles Hooker","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=STAT9916301","desc":"This seminar will be taken by doctoral candidates after the completion of most of their coursework. Topics vary from year to year and are chosen from advance probability, statistical inference, robust methods, and decision theory with principal emphasis on applications."},{"src":"2026A list (proxy)","sem":"2026A","cid":"STAT-9917","sid":"STAT-9917-301","cu":1,"title":"Sem in Adv Appl of Stat","days":"M, W","st":615,"et":704,"onList":"No","insts":[{"n":"Zhimei Ren","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=STAT9917301","desc":"This seminar will be taken by doctoral candidates after the completion of most of their coursework. Topics vary from year to year and are chosen from advance probability, statistical inference, robust methods, and decision theory with principal emphasis on applications."},{"src":"2026A list (proxy)","sem":"2026A","cid":"STAT-9910","sid":"STAT-9910-301","cu":0.5,"title":"Sem in Adv Appl of Stat","days":"W","st":720,"et":809,"onList":"No","insts":[{"n":"Enric Boix","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=STAT9910301","desc":"This seminar is for graduate students who wish to learn about current research frontiers. It covers advanced topics in probability, statistical theory and methods, applied statistics, data science and artificial intelligence. Specific topics vary from year to year and emphasize both theoretical foundations and applications.\nPlease note that this seminar course will NOT count towards the SDSD AM Degree.\n\n\n*******************************************************************************************************************\nPlease email Professor Enric Boix for permission and submit a permission request."},{"src":"2026A list (proxy)","sem":"2026A","cid":"OIDD-6750","sid":"OIDD-6750-001","cu":0.5,"title":"Financial Services Management","days":"M, W","st":510,"et":599,"onList":"Yes","listCU":0.5,"listSec":2,"insts":[{"n":"Patrick Harker","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=OIDD6750003","desc":"The financial services industry is a foundational pillar of both the U.S. and global economies, providing critical infrastructure for capital markets, credit intermediation, risk management, and financial planning. In the United States, the sector accounts for approximately 7.5% of GDP (excluding real estate), contributing over $2.2 trillion annually, and employs more than 8.5 million people. This course explores how process and technology management can be applied to improve efficiency, productivity and quality of this sector. We will take the traditional process view of operations to study how to design, deliver and innovate financial service processes with advances in technology. Drawing on the lessons from research and best practices, and from the perspective of financial institutions and regulators, the following topics will be covered: Designing Financial Services, Operational Risk Management in Financial Services, Innovating Financial Services. The course content blends rigorous quantitative and qualitative analysis, theories and practices, and practitioner and regulatory perspectives. The goal of this course is to cultivate the skills mandated by today’s increasingly complex and challenging environment facing financial services organizations."},{"src":"2026A list (proxy)","sem":"2026A","cid":"OIDD-6750","sid":"OIDD-6750-003","cu":0.5,"title":"Financial Services Management","days":"M, W","st":615,"et":704,"onList":"Yes","listCU":0.5,"listSec":2,"insts":[{"n":"Patrick Harker","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=OIDD6750003","desc":"The financial services industry is a foundational pillar of both the U.S. and global economies, providing critical infrastructure for capital markets, credit intermediation, risk management, and financial planning. In the United States, the sector accounts for approximately 7.5% of GDP (excluding real estate), contributing over $2.2 trillion annually, and employs more than 8.5 million people. This course explores how process and technology management can be applied to improve efficiency, productivity and quality of this sector. We will take the traditional process view of operations to study how to design, deliver and innovate financial service processes with advances in technology. Drawing on the lessons from research and best practices, and from the perspective of financial institutions and regulators, the following topics will be covered: Designing Financial Services, Operational Risk Management in Financial Services, Innovating Financial Services. The course content blends rigorous quantitative and qualitative analysis, theories and practices, and practitioner and regulatory perspectives. The goal of this course is to cultivate the skills mandated by today’s increasingly complex and challenging environment facing financial services organizations."},{"src":"2026A list (proxy)","sem":"2026A","cid":"OIDD-7610","sid":"OIDD-7610-401","cu":1,"title":"Climate Risks and Opportunitie","days":"M, W","st":825,"et":914,"onList":"No","insts":[{"n":"Parinitha Sastry","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=OIDD7610402","desc":"Climate change represents one of the most urgent threats to humanity’s future. Transforming the global economy to manage this threat will require trillions of dollars in capital, creating unprecedented risks as well as opportunities in financial markets. This course uses the tools of financial economics to understand strategies for managing risks and financing climate technologies across a range of asset classes, including carbon markets, project finance, venture capital, private equity, public equities, fixed income, and real assets. Students will also explore how financing strategies interact with public policy and political risk in both the developed and emerging market contexts. The course concludes with debates on corporate purpose, including what role businesses and financial institutions should play in addressing climate change."},{"src":"2026A list (proxy)","sem":"2026A","cid":"OIDD-7610","sid":"OIDD-7610-402","cu":1,"title":"Climate Risks and Opportunitie","days":"M, W","st":930,"et":1019,"pricedAs":"FNCE-7610-402","onList":"No","insts":[{"n":"Parinitha Sastry","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=OIDD7610402","desc":"Climate change represents one of the most urgent threats to humanity’s future. Transforming the global economy to manage this threat will require trillions of dollars in capital, creating unprecedented risks as well as opportunities in financial markets. This course uses the tools of financial economics to understand strategies for managing risks and financing climate technologies across a range of asset classes, including carbon markets, project finance, venture capital, private equity, public equities, fixed income, and real assets. Students will also explore how financing strategies interact with public policy and political risk in both the developed and emerging market contexts. The course concludes with debates on corporate purpose, including what role businesses and financial institutions should play in addressing climate change."},{"src":"2026A list (proxy)","sem":"2026A","cid":"OIDD-9010","sid":"OIDD-9010-002","cu":0.5,"title":"Oid Faculty and Research","days":"M, W","st":510,"et":689,"onList":"No","insts":[{"n":"Juan Santiago. Gallino","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=OIDD9010002","desc":"This course introduces first-year Operations, Information and Decisions (OID) PhD students to OID Department faculty members and their research. The course is designed to meet once a week, both in the fall and the spring, allowing most (if not all) OID faculty to present to first-year PhD students either classic or current research in their fields of expertise. The course's goals are twofold. First, it seeks to introduce first-year PhD students to OID faculty in a substantive (as opposed to social) manner and to expose students to the breadth of research conducted in the department. Second, through early exposure, the course aims to pique students' interest in the department's foundational courses in decision making, information systems, and operations management."},{"src":"2026A list (proxy)","sem":"2026A","cid":"OIDD-8050","sid":"OIDD-8050-401","cu":1,"title":"Risk Management","days":"T, R","st":615,"et":704,"pricedAs":"BEPP-8050-401","onList":"Yes","listCU":1,"listSec":1,"insts":[{"n":"Deniz Selman","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=OIDD8050401","desc":"The last financial crisis and subsequent recession provide ample evidence that failure to properly manage risk can result in disaster. Individuals and firms confront risk in nearly all decisions they make. People face uncertainty in their choice of careers, spending and saving decisions, family choices, and many other facets of life. Similarly, the value that firms create by designing and marketing good products is at risk from a variety of sources. The bankruptcy of a key supplier, sharp rise in cost of financing, destruction of an important asset, impact of global warming, or a liability suit can quickly squander the value created by firms. In extreme cases, risky outcomes can bankrupt a firm, as has happened recently to manufacturers of automobile parts and a variety of financial service firms. The events since the Global Financial Crisis also offer stark reminders that risk can impose significant costs on individuals, firms, governments, and societ6y as a whole. This course explores how individuals and firms assess and evaluate risk, examines the tools available to successfully manage risk, and discusses real-world phenomena that limit the desired amount of risk-sharing. Our focus is primarily on explaining the products and institutions that will serve you better when making decisisions in your future careers and lives."},{"src":"2026A list (proxy)","sem":"2026A","cid":"OIDD-9100","sid":"OIDD-9100-002","cu":0.5,"title":"Linear Optimization","days":"T","st":930,"et":1109,"onList":"No","insts":[{"n":"Noah F. Gans","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=OIDD9100002","desc":"This course covers the basics of linear optimization. You will learn what linear programs (LPs) are, what they are used for, and how they are solved. During the course, you will also find connections between LPs and some of the basics of microeconomic theory.\nThe mathematical prerequisites for the course are few. You should understand the basics of linear algebra, and we will review matrix operations, linear independence, and matrix inversion. While not strictly necessary, an understanding of partial derivatives will also help you to appreciate certain topics."},{"src":"2026A list (proxy)","sem":"2026A","cid":"OIDD-9340","sid":"OIDD-9340-002","cu":0.5,"title":"Dynamic Programming","days":"M","st":825,"et":1004,"onList":"No","insts":[{"n":"Noah F. Gans","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi/?term=202610&course=OIDD9340002","desc":"The course goal is to provide a brief but fairly rigorous introduction to the formulation and solution of dynamic programs. Its focus is primarily methodological. We will cover discrete state space problems, over finite or infinite time horizon, with and without discounting. Structured policies and their theoretical foundation will be of particular interest. Computational methods and approximation methods will be addressed. Applications are presented throughout the course, such as inventory policies, production control, financial decisions, and scheduling."},{"src":"2026A list (proxy)","sem":"2026A","cid":"OIDD-6910","sid":"OIDD-6910-401","cu":1,"title":"Negotiations","days":"M, W","st":825,"et":914,"onList":"Yes","listCU":1,"listSec":9,"insts":[{"n":"Erik Santoro","cq":"N/A","iq":"New","d":"N/A","w":"N/A"}],"syl":"https://apps.wharton.upenn.edu/syllabi
